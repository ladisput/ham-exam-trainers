/* combiner: two to four resistors, inductors or capacitors, in series or in parallel, drawn as a circuit with the total worked out.
   Resistors and inductors add in series; capacitors add in parallel (the rule flips).
   config {kind:'R'|'L'|'C', mode:'series'|'parallel', parts:[[value, prefix]], presets:[{q, kind, mode, parts}]}. */
WIDGETS.combiner=(el,c)=>{
  const KD={R:{n:'Resistors',u:'Ω',w:'ohms',pre:['','k']},L:{n:'Inductors',u:'H',w:'henries',pre:['','m','µ']},C:{n:'Capacitors',u:'F',w:'farads',pre:['µ','n','p']}};
  let st={kind:c.kind||'R',mode:c.mode||'series',parts:(c.parts||[[100,''],[200,'']]).map(([v,p])=>[String(v),p])};
  el.classList.add('wg');
  el.innerHTML=`<h3>Build it and total it</h3><p class="small mute lead">Pick the part, set the values, then flip between series and parallel. Watch which way the total moves.</p>
  <div class="seg cbk" role="group" aria-label="Part">${Object.entries(KD).map(([k,v])=>`<button data-k="${k}">${v.n}</button>`).join('')}</div>
  <div class="seg cbm" role="group" aria-label="Arrangement" style="margin-top:8px"><button data-m="series">Series</button><button data-m="parallel">Parallel</button></div>
  <svg class="circ cbs" viewBox="0 0 300 170" role="img"></svg><div class="cbp"></div><div class="wres"></div>`;
  const svg=el.querySelector('.cbs'),pb=el.querySelector('.cbp'),res=el.querySelector('.wres');
  const sym=(k,x,y,v)=>k==='R'?(v?`<path class="w" d="M${x} ${y} l-9 5 l18 7 l-18 7 l18 7 l-18 7 l9 5"/>`:`<path class="w" d="M${x} ${y} l5 -9 l7 18 l7 -18 l7 18 l7 -18 l5 9"/>`)
    :k==='L'?(v?`<path class="w" d="M${x} ${y} c12 0 12 10 0 10 c12 0 12 10 0 10 c12 0 12 10 0 10 c12 0 12 8 0 8"/>`:`<path class="w" d="M${x} ${y} c0 -12 10 -12 10 0 c0 -12 10 -12 10 0 c0 -12 10 -12 10 0 c0 -12 8 -12 8 0"/>`)
    :(v?`<path class="w" d="M${x} ${y} v15 M${x-14} ${y+15} h28 M${x-14} ${y+23} h28 M${x} ${y+23} v15"/>`:`<path class="w" d="M${x} ${y} h15 M${x+15} ${y-14} v28 M${x+23} ${y-14} v28 M${x+23} ${y} h15"/>`);
  function vals(){return st.parts.map(([v,p])=>num(v)*SIX[p])}
  function total(xs){const inv=st.kind==='C'?st.mode==='series':st.mode==='parallel';return inv?1/xs.reduce((a,x)=>a+1/x,0):xs.reduce((a,x)=>a+x,0)}
  function draw(){
    el.querySelectorAll('.cbk button').forEach(b=>{const on=b.dataset.k===st.kind;b.classList.toggle('pri',on);b.setAttribute('aria-pressed',on)});
    el.querySelectorAll('.cbm button').forEach(b=>{const on=b.dataset.m===st.mode;b.classList.toggle('pri',on);b.setAttribute('aria-pressed',on)});
    const n=st.parts.length,K=KD[st.kind],L=38,bat=(x,y)=>`<line x1="${x-10}" y1="${y}" x2="${x+10}" y2="${y}" class="w"/><line x1="${x-6}" y1="${y+10}" x2="${x+6}" y2="${y+10}" class="w" style="stroke-width:5"/>`;let g='';
    if(st.mode==='series'){const w=230/n;svg.setAttribute('viewBox','0 0 300 100');
      g+=bat(30,40)+`<path class="w" d="M30 40 V15 H35 M265 15 H270 V85 H30 V50"/>`;
      st.parts.forEach(([v,p],i)=>{const x0=35+i*w,s=x0+(w-L)/2;g+=`<path class="w" d="M${x0} 15 H${s} M${s+L} 15 H${x0+w}"/>${sym(st.kind,s,15,false)}<text class="lbl" x="${x0+w/2}" y="${st.kind==='C'?46:42}" style="text-anchor:middle">${esc(v+' '+p+K.u)}</text>`});
      g+=`<path class="flow" d="M30 40 V15 H270 V85 H30 V50"/>`}
    else{const w=n>1?175/(n-1):0,xl=105+w*(n-1);svg.setAttribute('viewBox','0 0 300 160');
      g+=bat(30,70)+`<path class="w" d="M30 70 V20 H${xl} M30 80 V140 H${xl}"/>`;
      st.parts.forEach(([v,p],i)=>{const x=105+i*w;g+=`<path class="w" d="M${x} 20 V${80-L/2} M${x} ${80+L/2} V140"/>${sym(st.kind,x,80-L/2,true)}<text class="lbl" x="${x-(st.kind==='C'?17:12)}" y="${st.kind==='C'?74:84}" style="text-anchor:end">${esc(v+' '+p+K.u)}</text><path class="flow" d="M30 70 V20 H${x} V${80-L/2} M${x} ${80+L/2} V140 H30 V80"/>`})}
    svg.innerHTML=g;svg.setAttribute('aria-label',`${n} ${K.n.toLowerCase()} in ${st.mode}`);
    pb.innerHTML=st.parts.map(([v,p],i)=>`<div class="cbrow"><label for="cb-${i}">Part ${i+1}</label><input id="cb-${i}" data-i="${i}" type="text" inputmode="decimal" value="${esc(v)}"><select data-i="${i}" aria-label="Unit for part ${i+1}">${[...new Set([...K.pre,p])].map(x=>`<option value="${x}"${x===p?' selected':''}>${x}${K.u}</option>`).join('')}</select>${n>2?`<button data-x="${i}" aria-label="Remove part ${i+1}">−</button>`:''}</div>`).join('')+(n<4?`<button class="cbadd" style="margin-top:8px;width:100%">+ Add a part</button>`:'');
    pb.querySelectorAll('input').forEach(x=>x.oninput=()=>{st.parts[+x.dataset.i][0]=x.value;unchip(el);calc()});
    pb.querySelectorAll('select').forEach(x=>x.onchange=()=>{st.parts[+x.dataset.i][1]=x.value;unchip(el);draw()});
    pb.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{st.parts.splice(+b.dataset.x,1);unchip(el);draw()});
    const ad=pb.querySelector('.cbadd');if(ad)ad.onclick=()=>{st.parts.push([...st.parts[st.parts.length-1]]);unchip(el);draw()};
    calc();
  }
  function calc(){
    const K=KD[st.kind],xs=vals();
    if(!xs.every(x=>x>0)){res.innerHTML='<p class="small mute" style="margin:0">Give every part a value above zero.</p>';return}
    const T=total(xs),inv=st.kind==='C'?st.mode==='series':st.mode==='parallel',sh=xs.map(x=>fmtSI(x,K.u)),eq=xs.every(x=>Math.abs(x/xs[0]-1)<1e-9);
    let how=inv?(eq?`Equal parts: one value divided by how many = ${sh[0]} / ${xs.length}`:xs.length===2?`Two parts: product over sum = (${sh.join(' x ')}) / (${sh.join(' + ')})`:`1 / (${sh.map(s=>'1/'+s).join(' + ')})`):`Add them: ${sh.join(' + ')}`;
    const up=T>xs[0];
    let ex='';
    if(st.kind==='R'&&st.mode==='parallel'){const V=12,I=xs.map(x=>V/x);ex=`<p class="small mute">With ${V} V across them, the branch currents ${I.map(i=>fmtSI(i,'A',3)).join(' + ')} add up to ${fmtSI(V/T,'A',3)} total.</p>`}
    res.innerHTML=`<div class="eq">Total = <em>${fmtSI(T,K.u)}</em></div><p class="small mute">${esc(how)} = ${fmtSI(T,K.u)}</p>
    <p>${inv?`${st.kind==='C'?'Capacitors in series':K.n+' in parallel'} combine like this, so the total is <b>smaller than the smallest part</b>.`:`${st.kind==='C'?'Capacitors in parallel':K.n+' in series'} simply add, so the total is <b>bigger than any one part</b>.`}</p>
    <p class="small">${st.kind==='C'?'Capacitors flip the rule: add in parallel, combine like parallel resistors in series.':'Resistors and inductors follow the same rule: add in series, combine in parallel.'} Adding one more ${K.n.toLowerCase().slice(0,-1)} in ${st.mode} makes the total go ${up?'up':'down'}.</p>${ex}`;
  }
  el.querySelectorAll('.cbk button').forEach(b=>b.onclick=()=>{if(st.kind===b.dataset.k)return;st.kind=b.dataset.k;const p=KD[st.kind].pre[0];st.parts=st.parts.map(([v])=>[v,p]);unchip(el);draw()});
  el.querySelectorAll('.cbm button').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;unchip(el);draw()});
  chips(el,c.presets,p=>{st={kind:p.kind,mode:p.mode,parts:p.parts.map(([v,x])=>[String(v),x])};draw()},el.querySelector('.lead').nextElementSibling);
  draw();
};

/* transformer: two windings on one core. Turns set the voltage ratio; current goes the other way; impedance goes as the square.
   config {np, ns, vp, presets:[{q, np, ns, vp, flip?, zp?, zs?}]}. With zp and zs the widget finds the turns ratio that matches them. */
WIDGETS.transformer=(el,c)=>{
  let st={np:c.np??500,ns:c.ns??1500,vp:String(c.vp??120),flip:false,match:null};
  el.classList.add('wg');
  el.innerHTML=`<h3>Wind the transformer</h3><p class="small mute lead">Drag the turns on each side. More turns on the output side steps the voltage up and the current down. The thicker wire carries more current.</p>
  <svg class="circ tf" viewBox="0 0 300 172" role="img" style="margin-bottom:14px"></svg>
  <label for="tf-p">Input (primary) turns: <b class="tfpn"></b></label><input id="tf-p" type="range" min="1" max="200" style="padding:0">
  <label for="tf-s" style="margin-top:10px">Output (secondary) turns: <b class="tfsn"></b></label><input id="tf-s" type="range" min="1" max="200" style="padding:0">
  <div class="fields"><div><label for="tf-v">Input volts AC</label><input id="tf-v" type="text" inputmode="decimal"></div></div>
  <button class="tfflip" style="width:100%;margin-top:10px">Feed it from the other side</button><div class="wres"></div>`;
  const svg=el.querySelector('svg'),sp=el.querySelector('#tf-p'),ss=el.querySelector('#tf-s'),$v=el.querySelector('#tf-v'),res=el.querySelector('.wres');
  const T=x=>Math.round(10*Math.exp(Math.log(300)*x/200)),Ti=t=>Math.round(200*Math.log(t/10)/Math.log(300));/* slider 1..200 -> about 10..3000 turns */
  function coil(x,n,w,left){const k=Math.max(3,Math.min(12,Math.round(3+Math.log2(n/10)*1.6)));let d=`M${x} 35`;const h=100/k;for(let i=0;i<k;i++)d+=left?` c-22 0 -22 ${h} 0 ${h}`:` c22 0 22 ${h} 0 ${h}`;return`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="${w}" stroke-linecap="round"/>`}
  function draw(){
    const np=st.flip?st.ns:st.np,ns=st.flip?st.np:st.ns,vp=num(st.vp),ratio=ns/np,vs=vp*ratio,ip=ratio,is=1;/* currents relative: input current = ratio x output current */
    sp.value=Ti(st.np);ss.value=Ti(st.ns);el.querySelector('.tfpn').textContent=fmt(st.np);el.querySelector('.tfsn').textContent=fmt(st.ns);$v.value=st.vp;
    const wP=Math.max(1.5,Math.min(9,3*Math.sqrt(ip))),wS=Math.max(1.5,Math.min(9,3*Math.sqrt(is)));
    const lw=st.flip?wS:wP,rw=st.flip?wP:wS;
    svg.innerHTML=`<rect x="120" y="22" width="60" height="126" rx="6" fill="none" stroke="var(--mute)" stroke-width="10" opacity=".55"/>
    <path d="M125 85 H175" stroke="var(--mute)" stroke-width="10" opacity=".55"/>
    <path class="flow" d="M150 27 H125 V143 H175 V27 Z" style="stroke:var(--blue);opacity:.8"/>
    ${coil(118,st.np,lw,true)}${coil(182,st.ns,rw,false)}
    <path d="M118 35 H40 M118 135 H40" fill="none" stroke="var(--ink)" stroke-width="${lw}"/><path d="M182 35 H260 M182 135 H260" fill="none" stroke="var(--ink)" stroke-width="${rw}"/>
    <text class="lbl" x="20" y="90">${st.flip?'out':'in'}</text><text class="lbl" x="262" y="90">${st.flip?'in':'out'}</text>
    <text class="lbl" x="70" y="25" style="text-anchor:middle">${fmt(st.np)} turns</text><text class="lbl" x="230" y="25" style="text-anchor:middle">${fmt(st.ns)} turns</text>
    <text class="lbl" x="150" y="166" style="text-anchor:middle">shared core: the field links both windings</text>`;
    svg.setAttribute('aria-label',`Transformer, ${st.np} turns and ${st.ns} turns${st.flip?', fed from the second side':''}`);
    if(!(vp>=0)){res.innerHTML='<p class="small mute" style="margin:0">Type the input voltage.</p>';return}

/* ---- General batch 2 widgets ---- */
const LOGS=(a,b,s)=>a*Math.pow(b/a,s/1000),LOGI=(a,b,v)=>Math.max(0,Math.min(1000,Math.round(1000*Math.log(v/a)/Math.log(b/a))));
function segOn(el,sel,attr,v){el.querySelectorAll(sel+' button').forEach(b=>{const on=b.dataset[attr]===String(v);b.classList.toggle('pri',on);b.setAttribute('aria-pressed',on)})}
/* spectrum(svg,{x0,x1,ticks,tl,lines:[{f,h 0..1,cls,lab,anc}],boxes:[{a,b,cls,lab}],H}): a frequency axis with signal lines */
function spectrum(svg,o){

  (o.ticks||[]).forEach(t=>{g+=`<line x1="${X(t)}" y1="${base}" x2="${X(t)}" y2="${base+5}" class="sx"/><text class="lbl" x="${X(t)}" y="${base+19}" style="text-anchor:middle">${o.tl(t)}</text>`});
  (o.lines||[]).forEach(l=>{if(l.f<o.x0||l.f>o.x1)return;const x=X(l.f),y=base-(base-top)*l.h;g+=`<line x1="${x}" y1="${base}" x2="${x}" y2="${y}" class="sl ${l.cls||''}"/>${l.lab?`<text class="lbl sll ${l.cls||''}" x="${x+(l.anc==='start'?-2:l.anc==='end'?2:0)}" y="${y-6}" style="text-anchor:${l.anc||'middle'}">${l.lab}</text>`:''}`});

/* reactance-graph: config {L µH, C pF, f MHz, mode series|parallel, presets:[{q, L, C, f or at:true (snap to resonance), mode, srf, show:'L'|'C'}]} */
WIDGETS['reactance-graph']=(el,c)=>{
  const FA=0.1,FB=100,LA=0.1,LB=100,CA=10,CB=2000,CP=3,ZA=1,ZB=1e5,XA=40,XB=290,YT=26,YB=176;

  el.classList.add('wg');
  el.innerHTML=`<h3>Slide the frequency</h3><p class="small mute lead">A coil's reactance climbs as the frequency goes up. A capacitor's falls. Where the two lines cross they are equal and cancel: that's resonance.</p>
  <div class="seg rgm" role="group" aria-label="Circuit"><button data-m="series">Series LC</button><button data-m="parallel">Parallel LC (tank)</button></div>
  <svg class="circ rg" viewBox="0 0 300 200" role="img"></svg>
  <div class="lgd"><span><i class="xl"></i>Coil X<sub>L</sub></span><span><i class="xc"></i>Capacitor X<sub>C</sub></span><span><i class="z"></i>Whole circuit</span></div>
  <label for="rg-f" style="margin-top:10px">Frequency: <b class="rgfv"></b></label><input id="rg-f" type="range" min="0" max="1000">
  <label for="rg-l" style="margin-top:8px">Coil, L: <b class="rglv"></b></label><input id="rg-l" type="range" min="0" max="1000">
  <label for="rg-c" style="margin-top:8px">Capacitor, C: <b class="rgcv"></b></label><input id="rg-c" type="range" min="0" max="1000">
  <button class="rgs" style="width:100%;margin-top:10px"></button><div class="wres"></div>`;
  const svg=el.querySelector('svg'),sf=el.querySelector('#rg-f'),sl=el.querySelector('#rg-l'),sc=el.querySelector('#rg-c'),res=el.querySelector('.wres'),bs=el.querySelector('.rgs');
  const X=f=>XA+(XB-XA)*Math.log(f/FA)/Math.log(FB/FA),Y=z=>YB-(YB-YT)*Math.log(Math.max(z,1e-6)/ZA)/Math.log(ZB/ZA);
  const xl=f=>2*Math.PI*f*st.L,xc=f=>1e6/(2*Math.PI*f*st.C),f0=()=>1e3/(2*Math.PI*Math.sqrt(st.L*st.C)),fsr=()=>1e3/(2*Math.PI*Math.sqrt(st.L*CP));
  const xr=f=>xl(f)/(1-(f/fsr())**2);/* coil with its own turn-to-turn capacitance: + inductive, - capacitive */
  const zn=f=>{const R=2,a=xl(f),b=xc(f);return st.mode==='series'?Math.hypot(R,a-b):Math.hypot(R,a)*b/Math.hypot(R,a-b)};
  const path=(fn,a=FA,b=FB)=>{let d='';for(let i=0;i<=180;i++){const f=a*Math.pow(b/a,i/180);d+=(i?'L':'M')+X(f).toFixed(1)+' '+Y(Math.abs(fn(f))).toFixed(1)}return d};
  const hz=f=>fmtSI(f*1e6,'Hz',3);
  function draw(){

    sf.value=LOGI(FA,FB,st.f);sl.value=LOGI(LA,LB,st.L);sc.value=LOGI(CA,CB,st.C);
    el.querySelector('.rgfv').textContent=hz(st.f);el.querySelector('.rglv').textContent=fmtSI(st.L*1e-6,'H',3);el.querySelector('.rgcv').textContent=fmtSI(st.C*1e-12,'F',3);
    bs.textContent=st.srf?'Back to the ideal coil':'Real coil: show its self-resonance';
    const F0=f0(),SR=fsr(),near=Math.abs(Math.log(st.f/F0))<0.02,dimL=st.show==='C',dimC=st.show==='L'||st.srf;
    let g=`<defs><clipPath id="rgclip"><rect x="${XA}" y="${YT}" width="${XB-XA}" height="${YB-YT}"/></clipPath></defs>`;
    [0.1,1,10,100].forEach((f,i)=>{g+=`<line x1="${X(f)}" y1="${YT}" x2="${X(f)}" y2="${YB}" class="gg"/><text class="lbl" x="${X(f)}" y="${YB+16}" style="text-anchor:${i===0?'start':i===3?'end':'middle'}">${['100 kHz','1 MHz','10 MHz','100 MHz'][i]}</text>`});
    [1,10,100,1e3,1e4,1e5].forEach((z,i)=>{g+=`<line x1="${XA}" y1="${Y(z)}" x2="${XB}" y2="${Y(z)}" class="gg"/><text class="lbl" x="${XA-4}" y="${Y(z)+4}" style="text-anchor:end">${['1','10','100','1k','10k','100k'][i]}</text>`});
    g+=`<text class="lbl" x="${XA-4}" y="${YT-12}" style="text-anchor:end">ohms</text><g clip-path="url(#rgclip)">`;

    g+=`<path d="${path(xc)}" class="gl xc" style="opacity:${dimC?.2:1}"/>`;
    if(st.srf){g+=`<path d="${path(xl)}" class="gl xl" style="opacity:.25"/><path d="${path(xr,FA,SR*0.999)}" class="gl xl"/><path d="${path(xr,SR*1.001,FB)}" class="gl xc" style="stroke-dasharray:7 4"/>`;
      if(SR<FB)g+=`<line x1="${X(SR)}" y1="${YT}" x2="${X(SR)}" y2="${YB}" class="gg" style="stroke-dasharray:3 3;stroke:var(--red)"/>`}
    else g+=`<path d="${path(xl)}" class="gl xl" style="opacity:${dimL?.2:1}"/>`;
    if(!st.srf&&F0>FA&&F0<FB)g+=`<circle cx="${X(F0)}" cy="${Y(xl(F0))}" r="6" class="gdot"/>`;
    g+=`</g><line x1="${X(st.f)}" y1="${YT}" x2="${X(st.f)}" y2="${YB}" class="gcur"/>`;
    if(!st.srf&&F0>FA&&F0<FB){const x=X(F0);g+=`<text class="lbl" x="${Math.max(XA+4,Math.min(XB-4,x))}" y="${YT+12}" style="text-anchor:${x<XA+60?'start':x>XB-60?'end':'middle'};fill:var(--ink)">resonance</text>`}
    if(st.srf&&SR<FB){const x=X(SR);g+=`<text class="lbl" x="${Math.min(x+4,XB-90)}" y="${YT+12}" style="fill:var(--red);text-anchor:start">self-resonance</text>`}

    <p class="small mute">X<sub>L</sub> = 2π f L. X<sub>C</sub> = 1 / (2π f C). Both are measured in ohms and written X. Resonance: f = 1 / (2π √(L C)) = <b>${hz(F0)}</b></p><p>${say}</p>`;
  }
  el.querySelectorAll('.rgm button').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;unchip(el);draw()});
  sf.oninput=()=>{st.f=LOGS(FA,FB,+sf.value);unchip(el);draw()};

/* Bessel J_0..J_n(x) by backward recurrence (Miller), for FM sidebands */
function besselJ(n,x){
  if(x===0)return Array.from({length:n+1},(_,i)=>i?0:1);
  const M=2*Math.ceil((Math.max(n,x)+20+Math.sqrt(40*Math.max(n,x)))/2);let j=new Array(M+2).fill(0);j[M]=1e-30;
  for(let k=M;k>0;k--){j[k-1]=2*k/x*j[k]-j[k+1];if(Math.abs(j[k-1])>1e200)for(let i=k-1;i<=M;i++)j[i]*=1e-200}
  let s=j[0];for(let k=2;k<=M;k+=2)s+=2*j[k];return j.slice(0,n+1).map(v=>v/s);
}
/* fm-spectrum: config {dev kHz, af kHz, osc MHz, out MHz, presets:[{q,dev,af,osc,out}]} */
WIDGETS['fm-spectrum']=(el,c)=>{

  el.classList.add('wg');
  el.innerHTML=`<h3>Spread an FM signal</h3><p class="small mute lead">Deviation is how far the carrier swings. The audio tone sets how fast it swings, and puts sidebands that far apart. Carson's rule: bandwidth = 2 x (deviation + audio).</p>
  <svg class="circ fs" viewBox="0 0 300 160" role="img"></svg>
  <label for="fm-d" style="margin-top:10px">Deviation: <b class="fmdv"></b></label><input id="fm-d" type="range" min="5" max="100">
  <label for="fm-a" style="margin-top:8px">Audio tone: <b class="fmav"></b></label><input id="fm-a" type="range" min="3" max="50">
  <div class="wres fmr"></div>
  <h3 style="margin-top:18px">Multiply up to VHF</h3><p class="small mute lead">Many VHF FM rigs modulate a low oscillator, then a multiplier stage makes a harmonic of it to reach the operating frequency. The deviation gets multiplied too.</p>
  <div class="fields"><div><label for="fm-o">Oscillator MHz</label><input id="fm-o" type="text" inputmode="decimal"></div><div><label for="fm-t">Transmitter MHz</label><input id="fm-t" type="text" inputmode="decimal"></div></div>
  <div class="wres fmc"></div>`;
  const svg=el.querySelector('svg'),sd=el.querySelector('#fm-d'),sa=el.querySelector('#fm-a'),$o=el.querySelector('#fm-o'),$t=el.querySelector('#fm-t'),r1=el.querySelector('.fmr'),r2=el.querySelector('.fmc');
  function draw(){
    sd.value=Math.round(st.dev*10);sa.value=Math.round(st.af*10);$o.value=st.osc;$t.value=st.out;
    el.querySelector('.fmdv').textContent=fmt(st.dev,3)+' kHz';el.querySelector('.fmav').textContent=fmt(st.af,3)+' kHz';
    const beta=st.dev/st.af,N=Math.floor(20/st.af),J=besselJ(N,beta),bw=2*(st.dev+st.af),lines=[];
    for(let n=-N;n<=N;n++){const h=Math.abs(J[Math.abs(n)]);if(h<0.01)continue;lines.push({f:n*st.af,h:Math.min(1,h)*.92,cls:n?'':'rf'})}
    spectrum(svg,{x0:-20,x1:20,ticks:[-20,-10,0,10,20],tl:t=>t?(t>0?'+':'−')+Math.abs(t):'carrier',H:160,lines,boxes:[{a:-(st.dev+st.af),b:st.dev+st.af,cls:'ok',lab:fmt(bw,3)+' kHz wide (Carson)'}]});
    svg.setAttribute('aria-label',`FM spectrum, ${fmt(bw,3)} kilohertz wide`);
    r1.innerHTML=`<div class="eq">2 x (${fmt(st.dev,3)} + ${fmt(st.af,3)}) = <em>${fmt(bw,3)} kHz</em></div>
    <p class="small mute">Sidebands sit every ${fmt(st.af,3)} kHz (the audio tone). Their size comes from deviation / audio = ${fmt(beta,3)}. Almost all the power lands inside Carson's bandwidth. Scale: kHz from the carrier.</p>
    ${Math.abs(J[0])<0.06?'<p class="small">At this setting the carrier itself almost vanishes: the power has moved into the sidebands.</p>':''}`;
    const o=num(st.osc),t=num(st.out);
    if(!(o>0&&t>0)){r2.innerHTML='<p class="small mute" style="margin:0">Type both frequencies.</p>';return}
    const m=t/o,whole=Math.abs(m-Math.round(m))<0.01,dOsc=st.dev*1000/m;
    r2.innerHTML=`<div class="chain${st.hi?' hi':''}"><div><span>Oscillator</span><b>${fmt(o,5)} MHz</b><small>± ${fmtSI(dOsc,'Hz',4)}</small></div><i>→</i><div class="mul"><span>Multiplier</span><b>x ${fmt(m,4)}</b></div><i>→</i><div><span>Transmitter</span><b>${fmt(t,5)} MHz</b><small>± ${fmt(st.dev,3)} kHz</small></div></div>
    <p class="small mute">Multiplier = ${fmt(t,5)} / ${fmt(o,5)} = ${fmt(m,4)}.${whole?'':' (Real multipliers are whole numbers, such as 2, 3 or 12.)'}</p>
    <p>For ${fmt(st.dev,3)} kHz at the antenna, the oscillator only needs ${fmt(st.dev,3)} kHz / ${fmt(m,4)} = <b>${fmtSI(dOsc,'Hz',4)}</b> of deviation.</p>`;
  }
  sd.oninput=()=>{st.dev=+sd.value/10;unchip(el);draw()};sa.oninput=()=>{st.af=+sa.value/10;unchip(el);draw()};
  $o.oninput=()=>{st.osc=$o.value;unchip(el);draw()};$t.oninput=()=>{st.out=$t.value;unchip(el);draw()};
  chips(el,c.presets,p=>{st={dev:p.dev??5,af:p.af??3,osc:String(p.osc??st.osc),out:String(p.out??st.out),hi:p.hi||''};draw();if(p.hi)el.querySelector('.fmc').scrollIntoView({block:'nearest',behavior:'smooth'})},el.querySelector('svg'));
  draw();
};

/* link-budget: config {w watts, tl, ta, path, ra, rl (dB), bw Hz, nf dB, g dB, presets:[{q, ...same keys, focus:'rx'}]} */
WIDGETS['link-budget']=(el,c)=>{
  const D={w:100,tl:1.5,ta:6,path:160,ra:2.15,rl:1.5,bw:2400,nf:3,g:20};
  const F=[['w','Transmitter watts'],['tl','Feed line loss, dB'],['ta','Transmit antenna gain, dBi'],['path','Path loss, dB'],['ra','Receive antenna gain, dBi'],['rl','Feed line loss, dB']];
  let st={...D,...c,focus:''};F.forEach(([k])=>st[k]=String(st[k]));
  el.classList.add('wg');
  el.innerHTML=`<h3>Follow the signal in dB</h3><p class="small mute lead">Start with the transmitter's power, add the antenna gains, take away every loss. What's left arrives at the receiver. Then compare it with the weakest signal the receiver can copy.</p>
  <svg class="circ lb" viewBox="0 0 300 210" role="img"></svg>
  <div class="fields lbf">${F.map(([k,l])=>`<div><label for="lb-${k}">${l}</label><input id="lb-${k}" data-k="${k}" type="text" inputmode="decimal"></div>`).join('')}</div>
  <div class="wres lbr"></div>
  <h3 style="margin-top:18px">What makes a receiver sensitive</h3><p class="small mute lead">Sensitivity is the weakest signal it can copy. Lower (more negative) is better.</p>
  <label for="lb-g">Front-end (input amplifier) gain: <b class="lbgv"></b></label><input id="lb-g" type="range" min="0" max="30">
  <label for="lb-n" style="margin-top:8px">Front-end noise figure: <b class="lbnv"></b></label><input id="lb-n" type="range" min="1" max="20">
  <label for="lb-b" style="margin-top:8px">Demodulator bandwidth: <b class="lbbv"></b></label><input id="lb-b" type="range" min="0" max="1000">
  <div class="wres lbs"></div>`;
  const svg=el.querySelector('svg'),r1=el.querySelector('.lbr'),r2=el.querySelector('.lbs'),sg=el.querySelector('#lb-g'),sn=el.querySelector('#lb-n'),sb=el.querySelector('#lb-b');
  const BA=100,BB=16000,NF2=20,SNR=10,db=x=>(x>0?'+':x<0?'−':'')+fmt(Math.abs(x),3);
  function sens(){const F1=10**(st.nf/10),F2=10**(NF2/10),G=10**(st.g/10),nfs=10*Math.log10(F1+(F2-1)/G);return{nfs,mds:-174+10*Math.log10(st.bw)+nfs,s:-174+10*Math.log10(st.bw)+nfs+SNR}}
  function draw(){
    F.forEach(([k])=>{const i=el.querySelector('#lb-'+k);if(document.activeElement!==i)i.value=st[k]});
    sg.value=st.g;sn.value=st.nf;sb.value=LOGI(BA,BB,st.bw);
    el.querySelector('.lbgv').textContent=st.g+' dB';el.querySelector('.lbnv').textContent=st.nf+' dB';el.querySelector('.lbbv').textContent=fmtSI(st.bw,'Hz',3);
    const v=Object.fromEntries(F.map(([k])=>[k,num(st[k])])),S=sens();
    if(!F.every(([k])=>isFinite(v[k]))||!(v.w>0)){r1.innerHTML='<p class="small mute" style="margin:0">Fill in every box.</p>';svg.innerHTML='';return}
    const p0=10*Math.log10(v.w*1000),steps=[['Transmitter',p0],['Feed line',-v.tl],['Antenna',v.ta],['Path',-v.path],['Antenna',v.ra],['Feed line',-v.rl]];
    let lv=[],acc=0;steps.forEach(([n,d],i)=>{acc=i?acc+d:d;lv.push(acc)});const rx=acc,mg=rx-S.s;
    const lo=Math.min(-150,S.s-10,rx-10),hi=Math.max(70,p0+10),XA=44,XB=292,YT=12,YB=184,Y=d=>YT+(hi-d)/(hi-lo)*(YB-YT),w=(XB-XA)/7;
    let g='';for(let d=Math.ceil(hi/50)*50;d>=lo;d-=50){g+=`<line x1="${XA}" y1="${Y(d)}" x2="${XB}" y2="${Y(d)}" class="gg"/><text class="lbl" x="${XA-4}" y="${Y(d)+4}" style="text-anchor:end">${d}</text>`}
    g+=`<text class="lbl" x="${XA-4}" y="${YT-2}" style="text-anchor:end">dBm</text>`;
    g+=`<rect x="${XA+6*w}" y="${Math.min(Y(rx),Y(S.s))}" width="${w}" height="${Math.abs(Y(rx)-Y(S.s))}" class="${mg>=0?'mgok':'mgbad'}"/><line x1="${XA}" y1="${Y(S.s)}" x2="${XB}" y2="${Y(S.s)}" class="sens"/><text class="lbl" x="${XA+4}" y="${Y(S.s)+15}" style="fill:var(--red);text-anchor:start">receiver needs ${fmt(S.s,4)} dBm</text>`;
    let d='';lv.forEach((L,i)=>{const x=XA+i*w;d+=(i?`V${Y(L)}`:`M${x} ${Y(L)}`)+`H${x+w}`});d+=`H${XB}`;g+=`<path d="${d}" class="gl xl"/>`;
    steps.forEach(([n,dd],i)=>{const x=XA+i*w+w/2,up=i===0||dd>=0;g+=`<text class="lbl" x="${x}" y="${Y(lv[i])+(up?-7:15)}" style="text-anchor:middle;fill:var(--ink)">${i?db(dd):fmt(p0,3)}</text>`});
    g+=`<text class="lbl" x="${XA+6.5*w}" y="${Y(rx)-7}" style="text-anchor:middle;fill:var(--blue)">${fmt(rx,4)}</text>`;
    svg.innerHTML=g;svg.setAttribute('aria-label',`Link budget: ${fmt(rx,4)} dBm arrives, margin ${fmt(mg,3)} dB`);
    r1.innerHTML=`<div class="eq">Arrives: <em>${fmt(rx,4)} dBm</em></div>
    <p class="small mute">Link budget = transmit power + antenna gains − all the losses, as seen at the receiver: ${fmt(p0,3)} dBm (${fmt(v.w)} W) − ${fmt(v.tl)} + ${fmt(v.ta)} − ${fmt(v.path)} + ${fmt(v.ra)} − ${fmt(v.rl)} = ${fmt(rx,4)} dBm.</p>
    <p><b>Link margin</b> = what arrives − the minimum the receiver needs = ${fmt(rx,4)} − (${fmt(S.s,4)}) = <b>${db(mg)} dB</b>. ${mg>=0?`That's how much fading the link can take before it drops out.`:`The signal is below what the receiver needs: no copy. Add power or gain, or cut losses.`}</p>`;
    r2.innerHTML=`<div class="eq">Sensitivity <em>${fmt(S.s,4)} dBm</em></div>
    <p class="small mute">Noise in the bandwidth (−174 + 10 log ${fmtSI(st.bw,'Hz',3)}) + system noise figure ${fmt(S.nfs,3)} dB + ${SNR} dB the mode needs.</p>
    <p>${st.focus==='rx'?'All three knobs matter: ':''}Narrow the bandwidth and less noise gets in. Lower the noise figure and the front end adds less noise. More front-end gain hides the noisier stages after it (they're set at ${NF2} dB here), until the front end's own noise figure is all that's left.</p>`;
  }
  el.querySelectorAll('.lbf input').forEach(i=>i.oninput=()=>{st[i.dataset.k]=i.value;unchip(el);draw()});
  sg.oninput=()=>{st.g=+sg.value;unchip(el);draw()};sn.oninput=()=>{st.nf=+sn.value;unchip(el);draw()};sb.oninput=()=>{st.bw=Math.round(LOGS(BA,BB,+sb.value)/10)*10;unchip(el);draw()};
  chips(el,c.presets,p=>{st={...D,...p,focus:p.focus||''};delete st.q;F.forEach(([k])=>st[k]=String(st[k]));draw();if(p.focus==='rx')el.querySelector('.lbs').scrollIntoView({block:'nearest',behavior:'smooth'})},el.querySelector('svg'));
  draw();
};

/* mixer: config {mode rx|mod|det, rf, lo MHz, af, bfo kHz, presets:[{q,mode,rf,lo,img,af,filt none|usb|lsb,bfo}]} */
WIDGETS.mixer=(el,c)=>{
  const IF=9,M={rx:'Receiver mixer',mod:'Balanced modulator',det:'Product detector'};
  let st={mode:c.mode||'rx',rf:c.rf??14.2,lo:c.lo??20,img:false,af:c.af??1,filt:'none',bfo:0};
  el.classList.add('wg');
  el.innerHTML=`<h3>Mix two frequencies</h3><p class="small mute lead">A mixer takes two signals in and puts out their sum and their difference. That one trick tunes a receiver, makes single sideband, and turns it back into audio.</p>
  <div class="seg mxm" role="group" aria-label="Circuit" style="flex-wrap:wrap">${Object.entries(M).map(([k,v])=>`<button data-m="${k}">${v}</button>`).join('')}</div>
  <svg class="circ mx" viewBox="0 0 300 170" role="img"></svg><div class="mxc"></div><div class="wres"></div>`;
  const svg=el.querySelector('svg'),ctl=el.querySelector('.mxc'),res=el.querySelector('.wres');
  const sld=(id,lab,min,max,step,v)=>`<label for="${id}" style="margin-top:10px">${lab}: <b class="${id}v"></b></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${v}">`;
  function controls(){
    if(st.mode==='rx')ctl.innerHTML=sld('mx-r','Signal you want (RF)',1,30,0.05,st.rf)+sld('mx-l','Local oscillator (LO)',10,40,0.05,st.lo)+`<div class="seg" style="margin-top:10px"><button class="mxt">Tune the LO onto it</button><button class="mxi"></button></div>`;
    else if(st.mode==='mod')ctl.innerHTML=sld('mx-a','Audio tone',0.3,3,0.1,st.af)+`<p class="small mute" style="margin:10px 0 4px">Sideband filter</p><div class="seg mxf"><button data-f="none">None</button><button data-f="usb">Keep upper</button><button data-f="lsb">Keep lower</button></div>`;
    else ctl.innerHTML=sld('mx-a','Voice tone in the signal',0.3,3,0.1,st.af)+sld('mx-b','BFO tuning error',-1,1,0.05,st.bfo);
    ctl.querySelectorAll('input').forEach(i=>i.oninput=()=>{const k={'mx-r':'rf','mx-l':'lo','mx-a':'af','mx-b':'bfo'}[i.id];st[k]=+i.value;unchip(el);draw()});
    const t=ctl.querySelector('.mxt');if(t)t.onclick=()=>{st.lo=+(st.rf+IF).toFixed(2);controls();unchip(el);draw()};
    const im=ctl.querySelector('.mxi');if(im)im.onclick=()=>{st.img=!st.img;unchip(el);draw()};
    ctl.querySelectorAll('.mxf button').forEach(b=>b.onclick=()=>{st.filt=b.dataset.f;unchip(el);draw()});
  }
  function draw(){
    segOn(el,'.mxm','m',st.mode);
    const sv=(id,t)=>{const b=ctl.querySelector('.'+id+'v');if(b)b.textContent=t};
    if(st.mode==='rx'){
      sv('mx-r',fmt(st.rf,4)+' MHz');sv('mx-l',fmt(st.lo,4)+' MHz');
      const im=ctl.querySelector('.mxi');if(im){im.textContent=st.img?'Remove the image signal':'Add a signal at the image';im.classList.toggle('pri',st.img)}
      const dif=Math.abs(st.lo-st.rf),sum=st.lo+st.rf,img=st.lo+IF,hit=Math.abs(dif-IF)<0.15,imd=Math.abs(img-st.lo);
      const lines=[{f:st.rf,h:.55,cls:'rf',lab:'RF'},{f:st.lo,h:.85,lab:'LO'},{f:dif,h:.3,cls:'out',lab:'diff'},{f:sum,h:.3,cls:'out',lab:'sum'}];
      if(st.img)lines.push({f:img,h:.55,cls:'img',lab:'image'});
      spectrum(svg,{x0:0,x1:72,ticks:[0,9,20,40,60],tl:t=>t===9?'IF 9':String(t),H:170,lines,boxes:[{a:IF-0.6,b:IF+0.6,cls:st.img&&Math.abs(imd-IF)<0.15?'bad':hit?'ok':''}]});
      svg.setAttribute('aria-label',`Mixer: RF ${st.rf} MHz, LO ${st.lo} MHz`);
      res.innerHTML=`<div class="eq">${fmt(st.lo,4)} − ${fmt(st.rf,4)} = <em>${fmt(dif,4)} MHz</em></div>
      <p class="small mute">Out of the mixer: the difference (${fmt(dif,4)} MHz) and the sum (${fmt(sum,4)} MHz). Mixing two RF signals like this is called <b>heterodyning</b>. The receiver's IF filter only passes 9 MHz. Scale: MHz.</p>
      <p>${hit?`Tuned in: the difference lands right in the 9 MHz IF filter. To listen to another station you <b>tune the local oscillator</b>, so every station mixes down to the same IF.`:`The difference isn't at 9 MHz, so nothing gets through the IF filter. Slide the <b>local oscillator</b> (or tap "Tune the LO onto it") until LO − RF = 9.`}</p>
      ${st.img?`<div class="note"><b>Image response</b>A station at ${fmt(img,4)} MHz is ${fmt(img-st.lo,4)} MHz above the LO, so it mixes to ${fmt(imd,4)} MHz too${Math.abs(imd-IF)<0.15?' and comes straight through the IF':''}. It sits <b>twice the IF</b> (${fmt(img-st.rf,4)} MHz) away from the signal you want. Only a filter before the mixer can keep it out.</div>`:''}`;
    }else if(st.mode==='mod'){
      sv('mx-a',fmt(st.af,3)+' kHz');ctl.querySelectorAll('.mxf button').forEach(b=>{const on=b.dataset.f===st.filt;b.classList.toggle('pri',on);b.setAttribute('aria-pressed',on)});
      const keep=s=>st.filt==='none'||st.filt===s,lines=[{f:0,h:.85,cls:'dash',lab:'carrier (cancelled)'}];
      if(keep('lsb'))lines.push({f:-st.af,h:.55,cls:'out',lab:'lower',anc:'end'});if(keep('usb'))lines.push({f:st.af,h:.55,cls:'out',lab:'upper',anc:'start'});
      const boxes=st.filt==='none'?[]:[{a:st.filt==='usb'?0.2:-3.4,b:st.filt==='usb'?3.4:-0.2,cls:'ok',lab:'filter'}];
      spectrum(svg,{x0:-4,x1:4,ticks:[-3,0,3],tl:t=>t?(t>0?'+':'−')+Math.abs(t)+' kHz':'9 MHz',H:170,lines,boxes});
      svg.setAttribute('aria-label','Balanced modulator output');
      res.innerHTML=`<div class="eq">${st.filt==='none'?'Out: <em>double sideband</em>':'Out: <em>single sideband</em>'}</div>
      <p class="small mute">The balanced modulator mixes the ${fmt(st.af,3)} kHz audio with a 9 MHz carrier oscillator. It puts out the sum (9 MHz + ${fmt(st.af,3)} kHz) and the difference (9 MHz − ${fmt(st.af,3)} kHz), and the "balanced" part cancels the carrier itself.</p>
      <p>${st.filt==='none'?'Both sidebands and no carrier: <b>double-sideband</b> suppressed-carrier RF. To make SSB, a <b>filter</b> keeps one sideband. Try one of the filter buttons.':`The <b>filter</b> keeps only the ${st.filt==='usb'?'upper':'lower'} sideband: that's ${st.filt.toUpperCase()}, single sideband.`}</p>`;
    }else{
      sv('mx-a',fmt(st.af,3)+' kHz');sv('mx-b',(st.bfo>0?'+':st.bfo<0?'−':'')+fmt(Math.abs(st.bfo),2)+' kHz');
      const out=st.af-st.bfo;
      spectrum(svg,{x0:-4,x1:4,ticks:[-3,0,3],tl:t=>t?(t>0?'+':'−')+Math.abs(t)+' kHz':'9 MHz',H:170,lines:[{f:st.af,h:.55,cls:'rf',lab:'USB signal',anc:'start'},{f:st.bfo,h:.85,lab:'BFO',anc:st.bfo>0.4?'start':'end'}]});
      svg.setAttribute('aria-label','Product detector inputs');
      res.innerHTML=`<div class="eq">Audio out: <em>${fmt(Math.abs(out),3)} kHz</em></div>
      <p class="small mute">The product detector mixes the incoming single sideband signal with a beat frequency oscillator (BFO) sitting where the missing carrier was. The difference is the audio. The sum (about 18 MHz) is filtered off.</p>
      <p>${Math.abs(st.bfo)<0.03?`BFO on frequency: the voice comes out at its real pitch (${fmt(st.af,3)} kHz in, ${fmt(st.af,3)} kHz out). This is how an SSB receiver <b>recovers the audio</b>.`:`BFO off by ${fmt(Math.abs(st.bfo),2)} kHz: every tone shifts by that much, so the voice sounds ${out>st.af?'high and squeaky':'low and growly'}. That's what you fix with the receiver's tuning knob.`}</p>`;
    }
  }
  el.querySelectorAll('.mxm button').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;controls();unchip(el);draw()});
  chips(el,c.presets,p=>{st={mode:p.mode||'rx',rf:p.rf??14.2,lo:p.lo??20,img:!!p.img,af:p.af??1,filt:p.filt||'none',bfo:p.bfo??0};controls();draw()},svg);
  controls();draw();
};
/* ---- General batch 3 widgets ---- */
/* two-tone: config {a1, a2 Hz, drive 0..100, presets:[{q,a1,a2,drive,hi:'odd'|'even'}]}. Two audio tones into an SSB transmitter; odd-order IMD lands beside them. */
WIDGETS['two-tone']=(el,c)=>{
  let st={a1:c.a1??700,a2:c.a2??1900,drive:c.drive??90,hi:''};
  el.classList.add('wg');
  el.innerHTML=`<h3>Two tones in, what comes out?</h3><p class="small mute lead">A two-tone test feeds two audio tones into a single sideband transmitter. A linear amplifier sends out just those two. Push it too hard and new signals appear right beside them.</p>
  <svg class="circ tt" viewBox="0 0 300 170" role="img"></svg>
  <label for="tt-1" style="margin-top:10px">Tone 1: <b class="tt1v"></b></label><input id="tt-1" type="range" min="300" max="2500" step="50">
  <label for="tt-2" style="margin-top:8px">Tone 2: <b class="tt2v"></b></label><input id="tt-2" type="range" min="300" max="3000" step="50">
  <label for="tt-d" style="margin-top:8px">Drive: <b class="ttdv"></b></label><input id="tt-d" type="range" min="0" max="100">
  <div class="wres"></div>`;
  const svg=el.querySelector('svg'),s1=el.querySelector('#tt-1'),s2=el.querySelector('#tt-2'),sd=el.querySelector('#tt-d'),res=el.querySelector('.wres');
  const hz=x=>fmt(x/1000,3)+' kHz';
  function draw(){
    s1.value=st.a1;s2.value=st.a2;sd.value=st.drive;
    el.querySelector('.tt1v').textContent=fmt(st.a1)+' Hz';el.querySelector('.tt2v').textContent=fmt(st.a2)+' Hz';el.querySelector('.ttdv').textContent=st.drive+'%'+(st.drive>70?' (overdriven)':st.drive>50?' (near the limit)':' (linear)');
    const f1=Math.min(st.a1,st.a2),f2=Math.max(st.a1,st.a2),sp=f2-f1;
    const im3=-60+Math.max(0,st.drive-40)*0.75,im5=im3-12,H=db=>Math.max(0,(db+60)/60);
    const lines=[{f:f1,h:.9,cls:'rf',lab:'F1'},{f:f2,h:.9,cls:'rf',lab:'F2'}];
    const odd=[[2*f1-f2,'2F1−F2',im3],[2*f2-f1,'2F2−F1',im3],[3*f1-2*f2,'3F1−2F2',im5],[3*f2-2*f1,'3F2−2F1',im5]];
    odd.forEach(([f,l,d],i)=>{if(H(d)>0.02)lines.push({f,h:Math.max(.04,H(d)*.9),cls:'out',lab:i<2&&H(d)>.25?l:''})});
    spectrum(svg,{x0:-3000,x1:6000,ticks:[-2000,0,2000,4000],tl:t=>t?(t>0?'+':'−')+Math.abs(t/1000)+' kHz':'carrier',H:170,lines,boxes:[{a:0,b:3000,cls:'',lab:'the SSB channel'}]});
    svg.setAttribute('aria-label',`Two tones at ${f1} and ${f2} hertz with intermodulation products`);
    const harm=[2,3,4].some(k=>Math.abs(f2-k*f1)<30)||sp<50;
    const lin=st.drive<=50;
    res.innerHTML=`<div class="eq">${lin?'Clean: <em>just two tones</em>':'Overdriven: <em>odd-order products</em>'}</div>
    <p class="small mute">The tones are ${fmt(sp)} Hz apart. Third-order products: 2F1 − F2 = ${hz(2*f1-f2)} and 2F2 − F1 = ${hz(2*f2-f1)}, also ${fmt(sp)} Hz away. Fifth-order (3F1 − 2F2 and 3F2 − 2F1) sit one more step out. Scale: offset from the suppressed carrier.</p>
    <p>${lin?`The amplifier is <b>linear</b>: what comes out is a bigger copy of what went in. The two-tone test checks exactly this: linearity.`:`Too much drive makes the amplifier <b>non-linear</b>, and the two tones mix inside it. That's <b>intermodulation</b>. The products to worry about are the <b>odd-order</b> ones (2F1 − F2: 2 + 1 = 3, odd), because they land right next to your signal where no filter can remove them.`}</p>
    <p class="small">Even-order products (F1 + F2, F2 − F1, 2F1) land far away from the band, where filters remove them easily.${st.hi==='even'?' That is why the odd ones are the closest.':''}</p>
    ${harm?'<div class="note"><b>Harmonically related tones</b>One tone is a multiple of the other, so a harmonic would sit on top of a real tone and spoil the test. A two-tone test uses two tones that are not harmonically related.</div>':''}`;
  }
  s1.oninput=()=>{st.a1=+s1.value;unchip(el);draw()};s2.oninput=()=>{st.a2=+s2.value;unchip(el);draw()};sd.oninput=()=>{st.drive=+sd.value;unchip(el);draw()};
  chips(el,c.presets,p=>{st={a1:p.a1??700,a2:p.a2??1900,drive:p.drive??90,hi:p.hi||''};draw()},svg);
  draw();
};

/* sun-timeline: config {ev flare|cme|hole|rot, t minutes since the event, presets:[{q,ev,t}]}. */
WIDGETS['sun-timeline']=(el,c)=>{
  const TA=1,TB=40*1440,EV={
    flare:{n:'Solar flare',arr:8.3,dur:120,what:'X-rays and ultraviolet light',how:'travel at the speed of light'},
    cme:{n:'Coronal mass ejection',arr:36*60,dur:2*1440,what:'a cloud of charged particles',how:'takes 15 hours to several days'},
    hole:{n:'Coronal hole',arr:3*1440,dur:2*1440,what:'a fast stream of charged particles',how:'takes a few days'},
    rot:{n:'The Sun turns',arr:27*1440,dur:0,what:'the same active region',how:'faces Earth again about every 27 days'}};
  let st={ev:c.ev||'flare',t:c.t??10};
  el.classList.add('wg');
  el.innerHTML=`<h3>Launch something from the Sun</h3><p class="small mute lead">Pick an event, then slide time forward to see when it reaches Earth and what it does to the bands.</p>
  <div class="seg stv" role="group" aria-label="Event" style="flex-wrap:wrap">${Object.entries(EV).map(([k,v])=>`<button data-e="${k}">${v.n}</button>`).join('')}</div>
  <svg class="circ st" viewBox="0 0 300 120" role="img"></svg>
  <label for="st-t" style="margin-top:6px">Time since it left the Sun: <b class="sttv"></b></label><input id="st-t" type="range" min="0" max="1000">
  <div class="stx"></div><div class="wres"></div>`;
  const svg=el.querySelector('svg'),sl=el.querySelector('#st-t'),bars=el.querySelector('.stx'),res=el.querySelector('.wres');
  const dur=m=>m<60?fmt(m,2)+' min':m<2880?fmt(m/60,2)+' hours':fmt(m/1440,2)+' days';
  function draw(){
    segOn(el,'.stv','e',st.ev);sl.value=LOGI(TA,TB,st.t);el.querySelector('.sttv').textContent=dur(st.t);
    const E=EV[st.ev],SX=34,EX=268,on=st.ev!=='rot'&&st.t>=E.arr&&st.t<E.arr+E.dur,past=st.ev!=='rot'&&st.t>=E.arr+E.dur;
    let g=`<circle cx="${SX}" cy="56" r="24" class="sun"/><circle cx="${EX}" cy="56" r="10" class="earth"/><text class="lbl" x="${SX}" y="102" style="text-anchor:middle">Sun</text><text class="lbl" x="${EX}" y="102" style="text-anchor:middle">Earth</text>`;
    if(st.ev==='rot'){const a=(st.t/(27*1440))*360%360,rad=(a-180)*Math.PI/180,x=SX+18*Math.cos(rad),vis=Math.cos(rad)>0;
      g+=vis?`<circle cx="${x}" cy="50" r="5" class="spot"/>`:'';g+=`<text class="lbl" x="150" y="20" style="text-anchor:middle">${vis?'the active region faces Earth':'the active region is round the back'}</text>`}
    else{const fr=Math.min(1,st.t/E.arr),x=SX+24+(EX-10-SX-24)*fr;
      if(st.ev==='flare')g+=`<path d="M${SX+24} 56 H${x}" class="ray"/>`;
      else g+=`<path d="M${x} 30 q10 26 0 52" class="front"/><path d="M${SX+24} 56 H${x}" class="trail"/>`;
      if(on&&st.ev!=='flare')g+=`<ellipse cx="${EX}" cy="56" rx="18" ry="20" class="mag"/>`}
    svg.innerHTML=g;svg.setAttribute('aria-label',`${E.n}, ${dur(st.t)} after it left the Sun`);
    const rows=[['Low bands by day (160–40 m)','ok'],['High bands (20–10 m)','ok'],['HF paths over the poles','ok'],['VHF off the aurora','none']];
    let say;
    if(st.ev==='flare'){if(on){rows[0][1]='gone';rows[1][1]='weak';say='The X-rays reached Earth about <b>8 minutes</b> after the flare. They supercharge the lowest layer on the daylit side: a <b>sudden ionospheric disturbance</b>. It soaks up the <b>lower frequencies more than the higher ones</b>, so the low bands fade out first.'}
      else if(past)say='The flare\'s X-rays have passed. The daylit side is back to normal within an hour or two.';
      else say=`The X-rays are on their way. Light takes about 8 minutes to cross from the Sun, so nothing has happened yet.`}
    else if(st.ev==='cme'||st.ev==='hole'){if(on){rows[2][1]='gone';rows[1][1]='weak';rows[3][1]='open';say=`The particles have reached Earth and shake its magnetic field: a <b>geomagnetic storm</b>, a temporary disturbance in Earth's magnetic field. HF is disturbed, worst on <b>high-latitude</b> paths over the poles. The one bonus: <b>auroras</b> that can reflect VHF signals.`}
      else if(past)say='The storm has passed and the field settles back down over the next day or so.';
      else say=`${E.what[0].toUpperCase()+E.what.slice(1)} is on its way. It ${E.how}, much slower than light.`}
    else say=`The Sun spins once about every 27 days (its surface layers take 26 to 28). An active region that's facing us now will face us again then, which is why HF conditions repeat in a <b>26 to 28 day cycle</b>.`;
    const W={ok:['fine','ok'],weak:['weaker','mid'],gone:['blacked out','bad'],none:['nothing','off'],open:['aurora: possible','ok']};
    bars.innerHTML=st.ev==='rot'?'':`<div class="stb">${rows.map(([n,s])=>`<div class="${W[s][1]}"><span>${n}</span><b>${W[s][0]}</b></div>`).join('')}</div>`;
    res.innerHTML=`<div class="eq">${E.n}: <em>${st.ev==='rot'?'every ~27 days':st.ev==='flare'?'8 minutes':st.ev==='cme'?'15 h to days':'a few days'}</em></div><p class="small mute">It sends ${E.what}, which ${E.how}.</p><p>${say}</p>`;
  }
  el.querySelectorAll('.stv button').forEach(b=>b.onclick=()=>{st.ev=b.dataset.e;st.t=Math.max(TA,Math.min(TB,EV[st.ev].arr*(st.ev==='rot'?1:1.2)));unchip(el);draw()});
  sl.oninput=()=>{st.t=LOGS(TA,TB,+sl.value);unchip(el);draw()};
  chips(el,c.presets,p=>{st={ev:p.ev||'flare',t:p.t??10};draw()},svg);
  draw();
};

/* sun-indices: config {ssn, k:[8 values], presets:[{q, ssn, k, focus:'sfi'|'k'|'a'|'20'}]}. */
WIDGETS['sun-indices']=(el,c)=>{
  const BANDS=[[1.9,'160'],[3.7,'80'],[7.15,'40'],[10.1,'30'],[14.2,'20'],[18.1,'17'],[21.2,'15'],[24.9,'12'],[28.5,'10']],KA=[0,3,7,15,27,48,80,140,240,400];

  function draw(){
    sl.value=st.ssn;el.querySelector('.sisv').textContent=st.ssn;

    bx.innerHTML=`<div class="sibands">${BANDS.map(([f,n])=>{const s=f<0.85*muf?'ok':f<muf?'mid':'bad',hi=st.focus==='20'&&n==='20';return`<div class="${s}${hi?' hi':''}"><i style="height:${s==='ok'?100:s==='mid'?55:12}%"></i><b>${n}</b></div>`}).join('')}</div><p class="small mute" style="margin:4px 0 0">Daytime long-distance, meters. Tall = reliable, short = closed.</p>`;
    const closed=BANDS.filter(([f])=>f>=muf).map(([,n])=>n);
    r1.innerHTML=`<div class="eq">Solar flux ≈ <em>${fmt(sfi,3)}</em></div>
    <p class="small mute">The solar flux index measures the Sun's radio noise at a wavelength of <b>10.7 centimeters</b> (2800 MHz). It rises and falls with the sunspots and is easier to measure than counting them.</p>
    <p>${closed.length?`Closed for long distance now: ${closed.join(', ')} meters. ${st.ssn<40?'At low solar activity <b>15, 12 and 10 meters</b> are the least reliable bands.':''}`:'Everything up to 10 meters is open: a solar maximum day.'} ${st.focus==='20'||st.ssn<40?'Notice <b>20 meters</b>: it stays open by day at <b>any point</b> in the cycle.':'Higher sunspot numbers mean a better chance of good propagation on the higher frequencies.'}</p>`;
    const a=st.k.map(k=>KA[k]),A=a.reduce((x,y)=>x+y,0)/8;let g='';
    st.k.forEach((k,i)=>{const x=24+i*34,h=k*12;g+=`<g class="kb" data-i="${i}" role="button" tabindex="0" aria-label="K ${k} for hours ${i*3} to ${i*3+3}"><rect x="${x}" y="${120-h}" width="28" height="${Math.max(2,h)}" class="${k>=5?'kst':k>=4?'kun':'kq'}"/><rect x="${x}" y="10" width="28" height="110" fill="transparent"/><text class="lbl" x="${x+14}" y="${116-h}" style="text-anchor:middle;fill:var(--ink)">${k}</text><text class="lbl" x="${x+14}" y="136" style="text-anchor:middle;font-size:11px">${String(i*3).padStart(2,'0')}h</text></g>`});
    svg.innerHTML=g;svg.setAttribute('aria-label','K index for each 3 hours of the day');
    svg.querySelectorAll('.kb').forEach(b=>{const go=()=>{const i=+b.dataset.i;st.k[i]=(st.k[i]+1)%10;unchip(el);draw()};b.onclick=go;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
    const mx=Math.max(...st.k);
    r2.innerHTML=`<div class="eq">A index <em>${fmt(A,3)}</em> · highest K <em>${mx}</em></div>
    <p class="small mute">Each K converts to an amplitude (K ${mx} = ${KA[mx]}); A is the average of the day's 8 amplitudes.</p>
    <p><b>K</b> = the <b>short-term</b> stability of Earth's magnetic field (each 3 hours). <b>A</b> = its <b>long-term</b> stability (the whole day). ${A>=30?'This is a storm day: expect poor HF, especially over the poles.':A>=15?'Unsettled: some disturbance.':'Quiet: good for HF.'}</p>
    <p class="small mute">Neither one counts sunspots or measures the Sun's own field. They measure Earth's.</p>`;
  }
  sl.oninput=()=>{st.ssn=+sl.value;unchip(el);draw()};
  el.querySelectorAll('.sik button').forEach(b=>b.onclick=()=>{st.k=(b.dataset.k==='s'?STORM:QUIET).slice();unchip(el);draw()});
  chips(el,c.presets,p=>{st={ssn:p.ssn??st.ssn,k:(p.k==='storm'?STORM:p.k==='quiet'?QUIET:st.k).slice(),focus:p.focus||''};draw();if(p.focus==='k'||p.focus==='a')r2.scrollIntoView({block:'nearest',behavior:'smooth'})},sl.previousElementSibling);

/* ionosphere: cross-section with frequency, takeoff angle and day/night/flare. config {f MHz, el degrees, tod day|night|flare, mode muf|regions,
   presets:[{q, f or snap:'muf'|'fc'|'ca', el, tod}]}. Simplified model: foF2 8 MHz day / 4 night, foE 3.5 day, secant law capped at 3.5, D absorption by day. */
WIDGETS.ionosphere=(el,c)=>{
  const FA=1.8,FB=50,R=6371,TOD={day:'Day',night:'Night',flare:'Solar flare'};
  let st={f:c.f??14.2,el:c.el??15,tod:c.tod||'day'};
  el.classList.add('wg');
  el.innerHTML=`<h3>Send a signal up</h3><p class="small mute lead">${c.mode==='regions'?'The ionosphere has layers. The low D layer soaks up low frequencies by day; the higher the layer that bends your signal back, the farther it lands.':'Slide the frequency and the takeoff angle. Too low and the signal is soaked up. Too high and it punches through into space. In between, it bends back to Earth.'}</p>
  <div class="seg iot" role="group" aria-label="Conditions">${Object.entries(TOD).map(([k,v])=>`<button data-t="${k}">${v}</button>`).join('')}</div>
  <svg class="circ io" viewBox="0 0 300 190" role="img"></svg>
  <label for="io-f" style="margin-top:8px">Frequency: <b class="iofv"></b></label><input id="io-f" type="range" min="0" max="1000">
  <label for="io-e" style="margin-top:8px">Takeoff angle: <b class="ioev"></b></label><input id="io-e" type="range" min="1" max="90">
  <div class="wres"></div>`;
  const svg=el.querySelector('svg'),sf=el.querySelector('#io-f'),se=el.querySelector('#io-e'),res=el.querySelector('.wres');
  const P=()=>{const d=st.tod!=='night';return{foF2:d?8:4,foE:d?3.5:0,hF:d?330:300,hE:105,Ld:st.tod==='flare'?15:st.tod==='day'?5:0}};
  const sec=e=>Math.min(3.5,1/Math.sin(e*Math.PI/180));
  const luf=(e,p)=>p.Ld?p.Ld/Math.pow(Math.sin(e*Math.PI/180),0.15):0;
  const hop=(e,h)=>{const r=e*Math.PI/180;return 2*R*(Math.PI/2-r-Math.asin(R*Math.cos(r)/(R+h)))*0.621};
  function draw(){
    segOn(el,'.iot','t',st.tod);sf.value=LOGI(FA,FB,st.f);se.value=Math.round(st.el);
    el.querySelector('.iofv').textContent=fmt(st.f,3)+' MHz';el.querySelector('.ioev').textContent=fmt(st.el,3)+'° above the horizon';
    const p=P(),muf=p.foF2*sec(st.el),mufE=p.foE*sec(st.el),L=luf(st.el,p);
    const out=st.f<L?'abs':st.f<=mufE?'E':st.f<=muf?'F':'thru',h=out==='E'?p.hE:p.hF,mi=out==='E'||out==='F'?hop(st.el,h):0;
    const X0=20,XW=260,GY=170,Y=k=>GY-k*0.42,dmax=Math.max(600,Math.min(2600,mi*1.15||0)),Xd=m=>X0+XW*m/dmax;
    let g=`<rect x="0" y="${GY}" width="300" height="20" class="gnd2"/>`;
    const lay=[['D',60,90,p.Ld>0],['E',100,125,p.foE>0],['F1',170,220,st.tod!=='night'],[st.tod==='night'?'F':'F2',260,360,true]];
    lay.forEach(([n,a,b,show])=>{if(!show)return;g+=`<rect x="0" y="${Y(b)}" width="300" height="${Y(a)-Y(b)}" class="lay l${n[0]}${n==='D'&&st.tod==='flare'?' hot':''}"/><text class="lbl" x="296" y="${(Y(a)+Y(b))/2+4}" style="text-anchor:end">${n}</text>`});
    if(st.tod==='night')g+=`<text class="lbl" x="296" y="${Y(75)+4}" style="text-anchor:end">D gone at night</text>`;
    const r=st.el*Math.PI/180;
    if(out==='abs'){const yh=75,dx=Math.min(250,(GY-Y(yh))/Math.tan(r)*1);g+=`<path d="M${X0} ${GY} L${X0+dx} ${Y(yh)}" class="ray2"/><text x="${X0+dx}" y="${Y(yh)+5}" class="xmark">✕</text>`}
    else if(out==='thru'){const dx=(GY-4)/Math.tan(r);const x=Math.min(296,X0+dx),y=dx>276?GY-276*Math.tan(r):4;g+=`<path d="M${X0} ${GY} L${x} ${y}" class="ray2"/>`}
    else{const xm=Xd(mi/2),xe=Xd(mi);g+=`<path d="M${X0} ${GY} L${xm} ${Y(h)} L${xe} ${GY}" class="ray2"/><circle cx="${xe}" cy="${GY}" r="4" class="land"/>${mi>=50?`<text class="lbl" x="${Math.min(290,xe)}" y="${GY+14}" style="text-anchor:${xe>250?'end':'middle'};fill:var(--ink)">${fmt(Math.round(mi/10)*10)} mi</text>`:''}`}
    g+=`<text class="lbl" x="${X0}" y="${GY+14}" style="text-anchor:middle;fill:var(--ink)">you</text>`;
    svg.innerHTML=g;svg.setAttribute('aria-label',`Ray at ${fmt(st.f,3)} MHz, ${fmt(st.el,3)} degrees: ${out}`);
    const ca=st.f>p.foF2?Math.asin(Math.min(1,p.foF2/st.f))*180/Math.PI:90;
    const tag={abs:'Absorbed',E:'Back to Earth off the E layer',F:'Back to Earth off the F'+(st.tod==='night'?'':'2')+' layer',thru:'Through into space'}[out];
    let say;
    if(out==='abs')say=st.tod==='flare'&&L>muf?`The flare has made the D layer so dense that the <b>LUF (${fmt(L,3)} MHz) is above the MUF (${fmt(muf,3)} MHz)</b>. No frequency works: ordinary skywave over this path is not possible.`
      :`Below the LUF (${fmt(L,3)} MHz at this angle). The signal is <b>attenuated</b> in the D layer before it gets anywhere. By day the D layer absorbs signals below about 10 MHz, which is why 160, 80, 60 and 40 meters struggle for long distance in daylight.`;
    else if(out==='thru')say=`Above the MUF (${fmt(muf,3)} MHz at this angle), so it <b>passes through</b> the ionosphere and is lost. ${st.f>p.foF2?`At ${fmt(st.f,3)} MHz the critical angle is ${fmt(ca,3)}°: lower the takeoff angle below that and it comes back.`:''}`;
    else{const best=st.f>0.85*muf&&out==='F'&&st.el<70,nv=st.el>=70,crit=st.el>=89&&Math.abs(st.f-p.foF2)<0.05,cang=st.f>p.foF2&&ca-st.el<1.5;say=`Between the LUF and the MUF, so it's <b>refracted back to Earth</b>, ${nv?'almost straight back down':`about ${fmt(Math.round(mi/10)*10)} miles away`}.${crit?' Sent straight up, this is the <b>critical frequency</b>: the highest frequency that still comes back. Any higher and it goes through.':''}${cang?` ${fmt(st.el,3)}° is just under the <b>critical angle</b> for ${fmt(st.f,3)} MHz (${fmt(ca,3)}°): the highest takeoff angle that still comes back. Any steeper and it escapes.`:''}${best?' Just below the MUF: the least attenuation for long-distance skip.':''}${nv&&!crit?' Nearly straight up and back down: <b>NVIS</b>, short-range coverage at a high angle. A horizontal dipole only 1/10 to 1/4 wavelength high sends its energy this way.':''}${out==='E'?' The E layer is lower, so its hop is shorter: about 1,200 miles at most.':st.el<=3?' The F2 layer is the highest, so its hop is the longest: about 2,500 miles at most.':''}`}
    res.innerHTML=`<div class="eq">${tag}</div>
    <div class="swr" style="margin-top:8px"><div><span>LUF here</span><b>${L?fmt(L,3)+' MHz':'none'}</b></div><div><span>MUF here</span><b>${fmt(muf,3)} MHz</b></div><div><span>Critical freq.</span><b>${p.foF2} MHz</b></div></div>
    <p>${say}</p>
    <p class="small mute">MUF and LUF are for this path: they change with distance and location, time of day, season, solar radiation and disturbances. The critical frequency is the highest one that comes back when sent straight up; the critical angle is the highest takeoff angle that still comes back.</p>`;
  }
  el.querySelectorAll('.iot button').forEach(b=>b.onclick=()=>{st.tod=b.dataset.t;unchip(el);draw()});
  sf.oninput=()=>{st.f=LOGS(FA,FB,+sf.value);unchip(el);draw()};se.oninput=()=>{st.el=+se.value;unchip(el);draw()};
  chips(el,c.presets,p=>{st={f:p.f??14.2,el:p.el??15,tod:p.tod||'day'};const q=P();
    if(p.snap==='muf')st.f=0.95*q.foF2*sec(st.el);if(p.snap==='fc'){st.el=90;st.f=q.foF2}if(p.snap==='ca')st.el=Math.asin(q.foF2/st.f)*180/Math.PI-0.5;draw()},svg);
  draw();
};
/* Morse "CQ" on a 650 Hz tone through Web Audio, for hearing propagation effects. o: {lvl 0-1, flut (flutter + several paths),
   echo (seconds), noise 0-1}. Returns false when the browser has no audio. */
let ACX=null;
function playCW(o){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{ACX=ACX||new AC();if(ACX.state==='suspended')ACX.resume()}catch(e){return false}
  const a=ACX,t0=a.currentTime+.05,u=.07,out=a.createGain();out.gain.value=.3;out.connect(a.destination);
  const key=a.createGain();key.gain.setValueAtTime(0,t0);let t=t0;
  for(const ch of '-.-. --.-'){if(ch===' '){t+=2*u;continue}const d=ch==='-'?3*u:u;key.gain.setValueAtTime(0,t);key.gain.linearRampToValueAtTime(1,t+.006);key.gain.setValueAtTime(1,t+d-.006);key.gain.linearRampToValueAtTime(0,t+d);t+=d+u}
  const end=t+.4+(o.echo||0),osc=a.createOscillator();osc.frequency.value=650;osc.connect(key);
  const lv=a.createGain();lv.gain.value=o.lvl??1;lv.connect(out);
  const path=(delay,g,fl)=>{const dn=a.createDelay(1);dn.delayTime.value=delay;const gn=a.createGain();gn.gain.value=g;key.connect(dn).connect(gn).connect(lv);
    if(fl){[[fl,.45*g],[fl*1.6,.25*g]].forEach(([hz,amt])=>{const l=a.createOscillator(),lg=a.createGain();l.frequency.value=hz;lg.gain.value=amt;l.connect(lg).connect(gn.gain);l.start(t0);l.stop(end)})}};
  if(o.flut){path(0,.5,9);path(.004,.4,13);path(.009,.35,7)}else path(0,1,0);
  if(o.echo)path(o.echo,.55,0);
  if(o.noise){const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*(end-t0+.1),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    n.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=.7;const ng=a.createGain();ng.gain.value=o.noise;n.connect(f).connect(ng).connect(out);n.start(t0);n.stop(end)}
  osc.start(t0);osc.stop(end);return true;
}

/* skip-zone: cross-section with ground wave, the skip zone and sky wave, and scatter leaking into the skip zone.
   config {band '40'|'20'|'10', d miles, scatter, presets:[{q, band, d, scatter, focus 'which'|'flutter'|'distort'|'weak'}]}. Illustrative distances. */
WIDGETS['skip-zone']=(el,c)=>{
  const BANDS={'40':{gw:60,sk:250,n:'40 m at night'},'20':{gw:40,sk:600,n:'20 m by day'},'10':{gw:25,sk:1100,n:'10 m by day'}},DMAX=2500;
  let st={band:c.band||'20',d:c.d??300,sc:!!c.scatter,focus:null};
  el.classList.add('wg');
  el.innerHTML=`<h3>Find the skip zone</h3><p class="small mute lead">Slide the other station away from you. Close in, the ground wave reaches them. Far out, the sky wave lands. In between is a gap the sky wave jumps right over.</p>
  <div class="seg skb" role="group" aria-label="Band">${Object.entries(BANDS).map(([k,v])=>`<button data-b="${k}">${v.n}</button>`).join('')}</div>
  <svg class="circ sk" viewBox="0 0 300 190" role="img"></svg>
  <label for="sk-d" style="margin-top:8px">The other station is <b class="skdv"></b> away</label><input id="sk-d" type="range" min="0" max="1000">
  <div class="row" style="gap:8px;margin-top:8px"><button class="smb skt" aria-pressed="false">Scatter</button><button class="smb lis">▶ Listen</button></div>
  <div class="meterbar skm"><i></i></div><div class="wres"></div>`;
  const svg=el.querySelector('svg'),sd=el.querySelector('#sk-d'),res=el.querySelector('.wres'),bar=el.querySelector('.skm');
  const GY=146,X=d=>20+270*Math.sqrt(Math.min(d,DMAX)/DMAX),FY=62;
  const state=()=>{const B=BANDS[st.band];return st.d<=B.gw?'gw':st.d<B.sk?(st.sc?'sc':'none'):'sky'};
  function draw(){
    segOn(el,'.skb','b',st.band);sd.value=LOGI(10,DMAX,st.d);el.querySelector('.skdv').textContent=fmt(Math.round(st.d/10)*10||10)+' miles';
    const t=el.querySelector('.skt');t.classList.toggle('pri',st.sc);t.setAttribute('aria-pressed',st.sc);t.textContent=st.sc?'Scatter: on':'Scatter: off';
    const B=BANDS[st.band],s=state(),xg=X(B.gw),xs=X(B.sk),xf=X(st.d);
    let g=`<defs><pattern id="skh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="skhl"/></pattern></defs>`;
    g+=`<rect x="0" y="${FY-14}" width="300" height="24" class="lay lF"/><text class="lbl" x="296" y="${FY+3}" style="text-anchor:end">F layer</text>`;
    g+=`<rect x="0" y="${GY}" width="300" height="44" class="gnd2"/>`;
    g+=`<rect x="${xg}" y="${GY}" width="${xs-xg}" height="22" class="skz"/><rect x="${xg}" y="${GY}" width="${xs-xg}" height="22" fill="url(#skh)"/><text class="lbl" x="${(xg+xs)/2}" y="${GY+37}" style="fill:var(--red);font-weight:700">skip zone</text>`;
    g+=`<path d="M20 ${GY-2} L${xg} ${GY-2}" class="skgw"/>`;
    [B.sk,B.sk*1.5,B.sk*2.3,DMAX].forEach((d,i)=>{if(d>DMAX)return;const xm=(20+X(d))/2;g+=`<path d="M20 ${GY} L${xm} ${FY} L${X(d)} ${GY}" class="skray${i?'':' first'}"/>`});
    g+=`<path d="M20 ${GY} L${X(B.sk*.25)} 4" class="skray thru"/>`;
    if(st.sc){const tx=s==='sc'?xf:(xg+xs)/2;[[X(B.sk*1.2),GY],[ (20+xs)/2+18,FY+8],[(20+xs)/2-14,FY+8]].forEach(([x,y])=>{g+=`<path d="M${x} ${y} L${tx} ${GY-3}" class="skscat"/>`})}
    g+=`<circle cx="20" cy="${GY}" r="5" class="land"/><text class="lbl" x="18" y="${GY+16}" style="fill:var(--ink);text-anchor:start">you</text>`;
    g+=`<g class="skf"><line x1="${xf}" y1="${GY}" x2="${xf}" y2="${GY-22}"/><circle cx="${xf}" cy="${GY-24}" r="3.5"/></g>`;
    [100,500,1000,2000].forEach(d=>{g+=`<line x1="${X(d)}" y1="${GY}" x2="${X(d)}" y2="${GY+4}" class="sktk"/><text class="lbl" x="${X(d)}" y="${GY+16}" style="font-size:11px">${d<1000?d:d/1000+'k'} mi</text>`});
    svg.innerHTML=g;svg.setAttribute('aria-label',`Ground wave to ${B.gw} miles, skip zone to ${B.sk} miles; the other station is at ${Math.round(st.d)} miles`);
    const lv={gw:Math.max(.35,1-st.d/B.gw*.5),none:0,sc:.14,sky:.8}[s];
    bar.classList.toggle('flut',s==='sc');bar.querySelector('i').style.width=Math.round(lv*100)+'%';
    const F=k=>st.focus===k?' class="hl"':'';
    const say={gw:`Close enough for the <b>ground wave</b>, which hugs the Earth for a few dozen miles on HF. Steady and clear.`,
      none:`You're in the <b>skip zone</b>: too far for the ground wave, too close for the sky wave, which comes down beyond ${fmt(B.sk)} miles. Even the steepest ray that still bends back lands past you. Nothing but noise. Turn on scatter.`,
      sc:`In the skip zone, but you can hear them by <b>scatter</b>: the propagation that lets signals be heard in the transmitting station's skip zone.
        <span${F('weak')}>It's <b>weak</b>, because only a small part of the signal energy is scattered into the skip zone.</span>
        <span${F('distort')}>It sounds <b>distorted</b>, because the energy is scattered into the skip zone through several different paths that arrive a little out of step.</span>
        <span${F('flutter')}>Listen: scatter signals have a <b>fluttering</b> sound.</span>`,
      sky:`Beyond the skip zone: the <b>sky wave</b> comes back down here. Strong, with only the usual slow fading.`}[s];
    res.innerHTML=`<div class="eq">${ ({gw:'Ground wave',none:'Skip zone: silence',sc:'Scatter: weak and fluttery',sky:'Sky wave'})[s]}</div><p>${say}</p>`;
  }
  el.querySelectorAll('.skb button').forEach(b=>b.onclick=()=>{st.band=b.dataset.b;unchip(el);draw()});
  sd.oninput=()=>{st.d=LOGS(10,DMAX,+sd.value);st.focus=null;unchip(el);draw()};
  el.querySelector('.skt').onclick=()=>{st.sc=!st.sc;unchip(el);draw()};
  el.querySelector('.lis').onclick=()=>{const s=state();playCW({gw:{lvl:.9,noise:.03},none:{lvl:0,noise:.12},sc:{lvl:.22,flut:1,noise:.08},sky:{lvl:.8,noise:.04}}[s])};
  chips(el,c.presets,p=>{st={band:p.band||'20',d:p.d??300,sc:!!p.scatter,focus:p.focus||null};draw()},svg);
  draw();
};

/* great-circle: azimuthal equidistant map centred on the station, with a beam you can turn, a short or long path to a city, and the echo
   when both paths are open. config {home:[lat,lon,name], to, path 'short'|'long', both, presets:[{q, to, path, both, focus 'map'}]}. */
WIDGETS['great-circle']=(el,c)=>{
  const H=c.home||[39.1,-94.6,'Kansas'],CITIES={London:[51.5,-.13],Tokyo:[35.7,139.7],Sydney:[-33.9,151.2],'Cape Town':[-33.9,18.4],Rio:[-22.9,-43.2],Mumbai:[19.1,72.9]};
  const RAD=Math.PI/180,EK=40075,CX=150,CY=150,RR=132;
  const geo=([la,lo])=>{const p1=H[0]*RAD,p2=la*RAD,dl=(lo-H[1])*RAD;
    const b=(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))/RAD+360)%360;
    const d=Math.acos(Math.min(1,Math.sin(p1)*Math.sin(p2)+Math.cos(p1)*Math.cos(p2)*Math.cos(dl)))*6371;return{b,d}};
  const P=(b,d)=>[CX+RR*d/(EK/2)*Math.sin(b*RAD),CY-RR*d/(EK/2)*Math.cos(b*RAD)];
  let st={to:c.to||'London',path:c.path||'short',both:!!c.both,head:null,focus:null};
  el.classList.add('wg');
  el.innerHTML=`<h3>Point the beam</h3><p class="small mute lead">This map is centred on you, so every straight line from the middle is a true bearing and a true distance. The outer rim is the far side of the Earth. Pick a station, then go the short way or the long way round.</p>
  <div class="seg gct" role="group" aria-label="Station">${Object.keys(CITIES).map(k=>`<button data-t="${k}">${k}</button>`).join('')}</div>
  <svg class="circ gc" viewBox="0 0 300 300" role="img"></svg>
  <div class="seg gcp" role="group" aria-label="Path" style="margin-top:8px"><button data-p="short">Short path</button><button data-p="long">Long path</button></div>
  <label for="gc-h" style="margin-top:8px">Beam heading: <b class="gchv"></b></label><input id="gc-h" type="range" min="0" max="359">
  <div class="row" style="gap:8px;margin-top:8px"><button class="smb gcb" aria-pressed="false">Both paths open</button><button class="smb lis">▶ Listen</button></div>
  <div class="wres"></div>`;
  const svg=el.querySelector('svg'),sh=el.querySelector('#gc-h'),res=el.querySelector('.wres');
  const ang=(a,b)=>Math.abs(((a-b)%360+540)%360-180);
  function draw(){
    const T=geo(CITIES[st.to]),lb=(T.b+180)%360,want=st.path==='long'?lb:T.b;if(st.head==null)st.head=Math.round(want);
    segOn(el,'.gct','t',st.to);segOn(el,'.gcp','p',st.path);sh.value=Math.round(st.head);
    const bt=el.querySelector('.gcb');bt.classList.toggle('pri',st.both);bt.setAttribute('aria-pressed',st.both);
    el.querySelector('.gchv').textContent=Math.round(st.head)+'°';
    let g=`<circle cx="${CX}" cy="${CY}" r="${RR}" class="gcsea"/>`;
    [5000,10000,15000].forEach(k=>{g+=`<circle cx="${CX}" cy="${CY}" r="${RR*k/(EK/2)}" class="gcring"/><text class="lbl" x="${CX}" y="${CY+RR*k/(EK/2)-3}" style="font-size:10px">${fmt(Math.round(k*.621/100)*100)} mi</text>`});
    [['N',0],['E',90],['S',180],['W',270]].forEach(([n,b])=>{const[x,y]=P(b,EK/2*1.09);g+=`<text class="lbl" x="${x}" y="${y+4}" style="fill:var(--ink)">${n}</text>`});
    const beam=b=>{const[x1,y1]=P(b-16,9000),[x2,y2]=P(b+16,9000),[x0,y0]=P(b,10400);return`<path d="M${CX} ${CY} L${x1} ${y1} Q${x0} ${y0} ${x2} ${y2} Z" class="gcbeam"/>`};
    g+=beam(st.head);
    const[cx,cy]=P(T.b,T.d),[rs,rsy]=P(T.b,EK/2),[rl,rly]=P(lb,EK/2);
    const onS=ang(st.head,T.b)<=20,onL=ang(st.head,lb)<=20;
    if(onS||st.both)g+=`<path d="M${CX} ${CY} L${cx} ${cy}" class="gcpath"/>`;
    if(onL||st.both)g+=`<path d="M${CX} ${CY} L${rl} ${rly}" class="gcpath lp"/><path d="M${rs} ${rsy} L${cx} ${cy}" class="gcpath lp"/><circle cx="${rl}" cy="${rly}" r="4" class="gcwrap"/><circle cx="${rs}" cy="${rsy}" r="4" class="gcwrap"/>`;
    Object.entries(CITIES).forEach(([n,ll])=>{const k=geo(ll),[x,y]=P(k.b,k.d),on=n===st.to;g+=`<circle cx="${x}" cy="${y}" r="${on?5:3}" class="gccity${on?' on':''}"/><text class="lbl" x="${x}" y="${y-8}" style="${on?'fill:var(--ink);font-weight:700':''}">${n}</text>`});
    g+=`<circle cx="${CX}" cy="${CY}" r="5" class="land"/><text class="lbl" x="${CX}" y="${CY+17}" style="fill:var(--ink)">you</text>`;
    svg.innerHTML=g;svg.setAttribute('aria-label',`Azimuthal map centred on ${H[2]}. ${st.to}: short path ${Math.round(T.b)} degrees, long path ${Math.round(lb)} degrees. Beam at ${Math.round(st.head)} degrees.`);
    const ds=T.d,dl=EK-T.d,ms=x=>x/299.79,echo=ms(dl)-ms(ds),mi=x=>fmt(Math.round(x*.621/100)*100);
    const aim=onS?'short':onL?'long':null;
    let say=st.both?`Both paths are open, so ${st.to} arrives twice: first by the short path, then ${fmt(Math.round(echo))} milliseconds later by the long path. You may hear a <b>slightly delayed echo</b>.`
      :aim==='short'?`Pointed at ${Math.round(T.b)}°, the <b>short path</b>: the direct great-circle route, ${mi(ds)} miles.`
      :aim==='long'?`Pointed at ${Math.round(lb)}°, the <b>long path</b>: <b>180 degrees from the short-path heading</b>, out the back and round the far side of the Earth, ${mi(dl)} miles. The two rim dots are the same place: the point opposite you.`
      :`The beam isn't pointed at ${st.to} either way. Short path is ${Math.round(T.b)}°, long path ${Math.round(lb)}°.`;
    if(st.focus==='map')say+=` An <b>azimuthal projection</b> map like this shows <b>true bearings and distances from one specific location</b>, here ${H[2]}. Land shapes get badly stretched toward the rim, so it's no good for accurate land masses.`;
    res.innerHTML=`<div class="eq">${st.both?'Echo: '+fmt(Math.round(echo))+' ms':aim?(aim==='short'?'Short path':'Long path')+': '+(aim==='short'?Math.round(T.b):Math.round(lb))+'°':'Off target'}</div>
    <div class="swr" style="margin-top:8px"><div><span>Short path</span><b>${Math.round(T.b)}° · ${mi(ds)} mi</b></div><div><span>Long path</span><b>${Math.round(lb)}° · ${mi(dl)} mi</b></div><div><span>Delay</span><b>${fmt(Math.round(ms(ds)))} / ${fmt(Math.round(ms(dl)))} ms</b></div></div><p>${say}</p>`;
  }
  const aimNow=()=>{const T=geo(CITIES[st.to]);st.head=Math.round(st.path==='long'?(T.b+180)%360:T.b)};
  el.querySelectorAll('.gct button').forEach(b=>b.onclick=()=>{st.to=b.dataset.t;st.focus=null;aimNow();unchip(el);draw()});
  el.querySelectorAll('.gcp button').forEach(b=>b.onclick=()=>{st.path=b.dataset.p;st.focus=null;aimNow();unchip(el);draw()});
  sh.oninput=()=>{st.head=+sh.value;unchip(el);draw()};
  el.querySelector('.gcb').onclick=()=>{st.both=!st.both;unchip(el);draw()};
  el.querySelector('.lis').onclick=()=>{const T=geo(CITIES[st.to]);const e=(EK-2*T.d)/299790;playCW(st.both?{lvl:.7,echo:Math.min(.3,e),noise:.04}:{lvl:.7,noise:.04})};
  chips(el,c.presets,p=>{st={to:p.to||'London',path:p.path||'short',both:!!p.both,head:null,focus:p.focus||null};draw()},svg);
  draw();
};

/* US amateur band plan for General and Extra, in kHz. Segment [lo, hi, kind, who]: kind cw = CW and data, ph = phone and image (and CW),
   all = every mode, cwo = CW only, vhf = every mode (VHF/UHF); who G = General and Extra, E = Extra only. Marks [lo, hi, label, text]. */
const USPLAN={
  '160':{n:'160 m',lo:1800,hi:2000,s:[[1800,2000,'all','G']]},
  '80':{n:'80/75 m',lo:3500,hi:4000,s:[[3500,3525,'cw','E'],[3525,3600,'cw','G'],[3600,3800,'ph','E'],[3800,4000,'ph','G']]},
  '40':{n:'40 m',lo:7000,hi:7300,s:[[7000,7025,'cw','E'],[7025,7125,'cw','G'],[7125,7175,'ph','E'],[7175,7300,'ph','G']]},
  '30':{n:'30 m',lo:10100,hi:10150,s:[[10100,10150,'cw','G']],note:'30 meters is CW and data only: phone and image are prohibited. Power limit 200 watts PEP.'},
  '20':{n:'20 m',lo:14000,hi:14350,s:[[14000,14025,'cw','E'],[14025,14150,'cw','G'],[14150,14225,'ph','E'],[14225,14350,'ph','G']],m:[[14070,14100,'Digital modes','Most digital mode activity on 20 meters is between 14.070 and 14.100 MHz.'],[14074,14077,'FT8','FT8 lives at about 14.074 to 14.077 MHz.']]},
  '17':{n:'17 m',lo:18068,hi:18168,s:[[18068,18110,'cw','G'],[18110,18168,'ph','G']]},
  '15':{n:'15 m',lo:21000,hi:21450,s:[[21000,21025,'cw','E'],[21025,21200,'cw','G'],[21200,21275,'ph','E'],[21275,21450,'ph','G']]},
  '12':{n:'12 m',lo:24890,hi:24990,s:[[24890,24930,'cw','G'],[24930,24990,'ph','G']]},
  '10':{n:'10 m',lo:28000,hi:29700,s:[[28000,28300,'cw','G'],[28300,29700,'ph','G']],m:[[29500,29700,'Repeaters','The portion of 10 meters above 29.5 MHz is available for repeater use.']],note:'CW is allowed across the entire band.'},
  '6':{n:'6 m',lo:50000,hi:54000,s:[[50000,50100,'cwo','G'],[50100,54000,'vhf','G']],m:[[50100,50125,'DX window','Band plan: from 50.100 to 50.125 MHz, stations in the 48 contiguous states make contacts only with stations outside the 48 states.']]},
  '2':{n:'2 m',lo:144000,hi:148000,s:[[144000,144100,'cwo','G'],[144100,148000,'vhf','G']]}
};
/* band-tuner: tune a displayed carrier frequency across a band; the signal is drawn on the side its mode puts it (voice: LSB below 10 MHz,
   USB above; RTTY LSB; FT8 USB; CW narrow), with a close-up of the band edges, and checked against the licence's privileges.
   config {bands:[keys of USPLAN], modes:[cw,voice,image,rtty,ft8], heading, lead, presets:[{q, b, f kHz, m, lic 'G'|'E', focus 'ssb'|'conv'|'hf'|'extra'|'upper'}]}. */
WIDGETS['band-tuner']=(el,c)=>{
  const BK=c.bands||Object.keys(USPLAN),MODES=c.modes||['cw','voice','image','rtty','ft8'],MN={cw:'CW',voice:'Voice',image:'Image',rtty:'RTTY',ft8:'FT8'};
  const cent=b=>{const B=USPLAN[b],p=B.s.find(s=>s[2]==='ph'&&s[3]==='G')||B.s[B.s.length-1];return Math.round((p[0]+p[1])/2)};
  let st={b:c.b||BK[0],f:null,m:c.m||MODES[0],lic:'G',focus:null};
  el.classList.add('wg');
  el.innerHTML=`<h3>${esc(c.heading||'Tune the band')}</h3><p class="small mute lead">${esc(c.lead||'Pick a band and a mode, then turn the dial. The close-up shows exactly where your signal sits.')}</p>
  <div class="seg btb" role="group" aria-label="Band">${BK.map(k=>`<button data-b="${k}">${USPLAN[k].n}</button>`).join('')}</div>
  <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><div class="seg btm" role="group" aria-label="Mode">${MODES.map(k=>`<button data-m="${k}">${MN[k]}</button>`).join('')}</div>
  <div class="seg btl" role="group" aria-label="Licence"><button data-l="G">General</button><button data-l="E">Extra</button></div></div>
  <svg class="bc bt" viewBox="0 0 320 168" role="img"></svg>
  <label for="bt-f">Displayed carrier: <b class="btfv"></b></label>
  <div class="row" style="gap:6px;align-items:center"><button class="smb btd" data-d="-1" aria-label="Down 1 kHz">−1k</button><input id="bt-f" type="range" style="flex:1;min-width:0"><button class="smb btd" data-d="1" aria-label="Up 1 kHz">+1k</button></div>
  <div class="wres"></div>`;
  const svg=el.querySelector('svg'),sf=el.querySelector('#bt-f'),res=el.querySelector('.wres');
  const side=()=>st.m==='cw'?'CW':st.m==='rtty'?'LSB':st.m==='ft8'?'USB':st.f<10000?'LSB':'USB';
  const occ=()=>{const s=side();return s==='CW'?[st.f-.1,st.f+.1]:s==='LSB'?[st.f-3,st.f]:[st.f,st.f+3]};
  const okKind=(k,m)=>k==='all'||k==='vhf'||m==='cw'&&k!=='x'||(k==='cw'&&(m==='rtty'||m==='ft8'))||(k==='ph'&&(m==='voice'||m==='image'));
  const ok=(s,m)=>okKind(s[2],m)&&(s[3]==='G'||st.lic==='E');
  const runs=(B,m)=>{const r=[];B.s.forEach(s=>{if(!ok(s,m))return;const l=r[r.length-1];if(l&&l[1]===s[0])l[1]=s[1];else r.push([s[0],s[1]])});return r};
  const MHz=k=>(k/1000).toFixed(Math.abs(k-Math.round(k))>1e-6?4:3)+' MHz';
  function draw(){
    const B=USPLAN[st.b];if(st.f==null)st.f=cent(st.b);st.f=Math.max(B.lo,Math.min(B.hi,st.f));
    segOn(el,'.btb','b',st.b);segOn(el,'.btm','m',st.m);segOn(el,'.btl','l',st.lic);
    sf.min=B.lo;sf.max=B.hi;sf.step=.5;sf.value=st.f;el.querySelector('.btfv').textContent=MHz(st.f);
    const X=f=>12+296*(f-B.lo)/(B.hi-B.lo),[o0,o1]=occ(),S=side(),R=runs(B,st.m),run=R.find(r=>st.f>=r[0]&&st.f<=r[1]);

/* power-limit: turn up a transmitter on a band and read PEP output against the limit. 30 m: 200 W PEP; 60 m: 100 W ERP over a dipole
   (antenna gain slider), USB, 2.8 kHz; spread spectrum 10 W; otherwise 1500 W PEP. config {b, w, presets:[{q, b, w, g dBd, ss, focus 'pep'|'bw'|'gain'}]}. */
WIDGETS['power-limit']=(el,c)=>{
  const BK=['160','80','60','40','30','20','17','15','12','10','6'];
  let st={b:c.b||'20',w:c.w??100,g:0,ss:false,focus:null};
  el.classList.add('wg');
  el.innerHTML=`<h3>Turn up the power</h3><p class="small mute lead">Pick a band and turn the knob. The meter reads what the FCC measures: peak envelope power at the transmitter's output.</p>
  <div class="seg plb" role="group" aria-label="Band">${BK.map(k=>`<button data-b="${k}">${k} m</button>`).join('')}</div>
  <div class="row" style="gap:8px;margin-top:8px"><button class="smb pls" aria-pressed="false">Spread spectrum</button></div>
  <svg class="circ pl" viewBox="0 0 300 150" role="img"></svg>
  <label for="pl-w" style="margin-top:8px">Transmitter output: <b class="plwv"></b></label><input id="pl-w" type="range" min="0" max="1000">
  <div class="plg" hidden><label for="pl-g" style="margin-top:8px">Antenna gain over a dipole: <b class="plgv"></b></label><input id="pl-g" type="range" min="0" max="12"></div>
  <div class="wres"></div>`;
  const svg=el.querySelector('svg'),sw=el.querySelector('#pl-w'),sg=el.querySelector('#pl-g'),res=el.querySelector('.wres');
  function draw(){
    segOn(el,'.plb','b',st.b);const s=el.querySelector('.pls');s.classList.toggle('pri',st.ss);s.setAttribute('aria-pressed',st.ss);
    sw.value=LOGI(1,3000,st.w);el.querySelector('.plwv').textContent=fmt(Math.round(st.w))+' W PEP';
    const six=st.b==='60'&&!st.ss;el.querySelector('.plg').hidden=!six;sg.value=st.g*2;el.querySelector('.plgv').textContent=fmt(st.g)+' dBd';
    const erp=st.w*10**(st.g/10),lim=st.ss?10:six?100:st.b==='30'?200:1500,val=six?erp:st.w,over=val>lim+1e-6;
    const lx=v=>14+272*Math.log10(Math.max(1,v))/Math.log10(3000);
    let g=`<rect x="4" y="20" width="76" height="40" rx="6" class="sbx"/><text class="lbl" x="42" y="44" style="fill:var(--ink);font-size:12px">Transmitter</text>
    <line x1="80" y1="40" x2="104" y2="40" class="coax"/><circle cx="122" cy="40" r="18" class="plmtr ${st.focus==='pep'?'hi':''}"/><text class="lbl" x="122" y="38" style="fill:var(--ink);font-size:10px">PEP</text><text class="lbl" x="122" y="50" style="font-size:9px">output</text>
    <line x1="140" y1="40" x2="236" y2="40" class="coax"/><text class="lbl" x="188" y="34" style="font-size:11px">feed line</text>
    <path d="M236 40 L252 40 M252 12 L252 64 M244 12 L260 12" class="w" style="stroke:var(--ink)"/>${six?`<text class="lbl" x="256" y="80" style="font-size:11px">ERP ${fmt(Math.round(erp))} W</text>`:''}`;
    g+=`<rect x="14" y="104" width="272" height="16" rx="4" class="plbg"/><rect x="14" y="104" width="${Math.max(2,lx(val)-14)}" height="16" rx="4" class="${over?'plover':'plok'}"/>`;
    g+=`<line x1="${lx(lim)}" y1="96" x2="${lx(lim)}" y2="126" class="pllim"/><text class="lbl" x="${lx(lim)}" y="92" style="fill:var(--red);font-weight:700;text-anchor:${lx(lim)>250?'end':'middle'}">limit ${fmt(lim)} W${six?' ERP':''}</text>`;
    [1,10,100,1000].forEach(v=>{g+=`<text class="lbl" x="${lx(v)}" y="138" style="font-size:10px">${fmt(v)}</text>`});
    svg.innerHTML=g;svg.setAttribute('aria-label',`${st.b} meters, ${Math.round(st.w)} watts PEP output, limit ${lim} watts`);
    const F=k=>st.focus===k?' class="hl"':'';
    const note=st.ss?`<b>Spread spectrum</b> transmissions are limited to <b>10 watts PEP output</b>, on any band where they're allowed.`
      :six?`60 meters is special. The limit is <b>100 watts ERP</b> (effective radiated power) compared to a half-wave dipole, so antenna gain counts against you. Upper sideband only, on set channels, with a <b>maximum bandwidth of 2.8 kHz</b>. <span${F('gain')}>${st.g>0?'This antenna isn\'t a dipole, so you must <b>keep a record of its gain</b>.':'Use an antenna other than a dipole and you must keep a record of its gain.'}</span>`
      :st.b==='30'?`30 meters (10.100 to 10.150 MHz) is the exception on HF: <b>200 watts PEP output</b>.`
      :`Every other HF band, and 6 meters, allows up to <b>1500 watts PEP output</b>${st.b==='10'?'. That includes a General on 28 MHz (Technicians are held to 200 watts on HF)':''}.`;
    res.innerHTML=`<div class="eq">${fmt(Math.round(val))} W${six?' ERP':' PEP'} · ${over?'<em>over the limit</em>':'within the limit'}</div>

    ${six&&st.focus==='bw'?'<p class="hl">On 60 meters USB, the maximum bandwidth permitted is <b>2.8 kHz</b>.</p>':''}`;
  }
  el.querySelectorAll('.plb button').forEach(b=>b.onclick=()=>{st.b=b.dataset.b;st.focus=null;unchip(el);draw()});
  el.querySelector('.pls').onclick=()=>{st.ss=!st.ss;unchip(el);draw()};
  sw.oninput=()=>{st.w=LOGS(1,3000,+sw.value);unchip(el);draw()};sg.oninput=()=>{st.g=+sg.value/2;unchip(el);draw()};
  chips(el,c.presets,p=>{st={b:p.b||'20',w:p.w??100,g:p.g||0,ss:!!p.ss,focus:p.focus||null};draw()},svg);
  draw();
};
function coreHtml(c){
  if(!c)return'';
  if(c.type==='rule-table'){const[h,...rows]=c.rows;return`<table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`}
  if(c.type==='formula')return`<div class="formula">${esc(c.text)}</div>${(c.lines||[]).map(l=>`<p class="sub mute">${esc(l)}</p>`).join('')}`;
  if(c.type==='list')return`<table>${c.items.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;
  return c.text?`<div class="formula">${esc(c.text)}</div>`:'';
}
async function showFam(id){
  const box=$('#fam');famOpen=id;app.hidden=true;box.hidden=false;

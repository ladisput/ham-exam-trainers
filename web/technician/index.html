  if(famOpen!==id)return;
  if(!f){box.innerHTML=`<button id="fback">← Back</button><div class="sp"></div><div class="card"><p>This page didn't load. Check your connection and try again.</p></div>`;$('#fback').onclick=famBack;return}
  const ids=famQs(id),r=rd(ids);
  box.innerHTML=`<button id="fback">← Back</button><div class="sp"></div>
  <div class="card"><p class="cond mute" style="font-size:18px;margin:0 0 4px">Still confused?</p><h2>${esc(f.title)}</h2><p class="idea">${esc(f.idea)}</p>
  <div class="core">${coreHtml(f.core)}</div></div>
  ${f.widget&&WIDGETS[f.widget.type]?`<div class="sp"></div><div class="card" id="widget"></div>`:''}
  ${f.compare&&f.compare.length?`<div class="sp"></div><div class="card"><h3>Side by side</h3><div class="cmp">${f.compare.map(c=>`<div><b>${esc(c.term)}</b>${esc(c.how)}</div>`).join('')}</div></div>`:''}
  ${f.traps&&f.traps.length?`<div class="sp"></div><div class="card"><h3>Traps the exam sets</h3>${f.traps.map(t=>`<div class="note trap"><b><span class="tq">${esc(t.q)}</span>Wrong: <s>${esc(t.wrong)}</s></b>${esc(t.why)}</div>`).join('')}</div>`:''}
  <div class="sp"></div><div class="card"><h3 style="margin-bottom:4px">The ${ids.length} questions</h3><p class="small mute" style="margin:0 0 6px">Tap one to see the answer and its note.</p>
  ${ids.map(q=>{const Q=BY[q],h=hookOf(q);return`<details class="fq"><summary><span class="cond">${q}</span><span>${esc(Q.q)}</span></summary>
  ${Q.f?`<div class="fig"><img src="fig/${Q.f}" alt="Figure ${esc(Q.f.replace('.png','').toUpperCase())}"></div>`:''}<div class="ans r">${esc(Q.a[Q.c])}</div>
  <div class="note"><b>Elmer's note</b>${h?esc(h):'No note written for this one yet.'}</div></details>`}).join('')}</div>
  <div class="sp"></div><div class="card"><div class="row" style="justify-content:space-between"><span class="small mute">${pct(r)} ready</span></div><div class="bar ${r>=.8?'done':''}" style="margin:6px 0 14px"><i style="width:${r*100}%"></i><s></s></div>
  <button class="pri" id="fdrill" style="width:100%">Drill these ${ids.length} questions</button></div>`;

  if($('#widget'))try{WIDGETS[f.widget.type]($('#widget'),f.widget.config||{},f)}catch(e){$('#widget').remove()}

function startFam(id){R={mode:'run',band:null,fam:id,kind:'Drill: '+FAM[id].title,hooks:true,qs:shuffle(famQs(id)),i:0,res:[]};view='run';ask()}
function famHash(){const m=location.hash.match(/^#family-([a-z0-9-]+)$/);return m&&FAM[m[1]]?m[1]:null}

function route(){const fh=famHash();if(fh){const h=location.hash;home();history.replaceState(null,'',h);famPushed=false;showFam(fh);return}
  const m=location.hash.match(new RegExp('^#band-('+CFG.letter+'\\d)$'));if(m&&BANDS.includes(m[1]))band(m[1]);else home()}
addEventListener('bip',()=>{if(POOL&&view==='home'&&!famOpen)home()});
addEventListener('hashchange',()=>{const fh=famHash();if(fh){showFam(fh);return}if(famOpen){closeFam();return}if(view==='run'&&R&&R.res.length)return;route()});

Promise.all([fetch('pool.json').then(r=>r.json()),fetch('hooks.json').then(r=>r.ok?r.json():{}).catch(()=>({})),fetch('families/_index.json').then(r=>r.ok?r.json():{families:[]}).catch(()=>({families:[]}))]).then(([p,h,fi])=>{
  POOL=p;HOOKS=h;POOL.qs.forEach(q=>{BY[q.id]=q;(GROUPS[q.id.slice(0,3)]=GROUPS[q.id.slice(0,3)]||[]).push(q.id)});
  BANDS=Object.keys(POOL.subs).sort();
  (fi.families||[]).forEach(f=>{FAM[f.id]=f;f.questions.forEach(q=>(QFAM[q]=QFAM[q]||[]).push(f.id))});
  route();
}).catch(()=>{app.innerHTML='<p>The question pool failed to load. Reload the page to try again.</p>'});

(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return;
    const id=await u.id();if(!id)return;
    db=d;docRef=db.doc('data/users/'+id+'/progress');
    const tm=new Promise(r=>setTimeout(()=>r(null),10000));
    const snap=await Promise.race([docRef.get(),tm]);
    if(snap&&snap.exists){const o=snap.data();if((o.ts||0)>(P.ts||0)){P=Object.assign({v:1,call:'',h:{},runs:{},exams:[]},JSON.parse(JSON.stringify(o)));try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}if(POOL&&view!=='run'&&!famOpen)route()}}
    else if(snap&&P.ts)dirty=true;
    syncNote=snap?'Progress syncs to your Claude account, so it follows you across devices.':'';
    if(dirty)flush();
    if(POOL&&view==='home'&&!famOpen)home();
  }catch(e){}
})();
}
